# .tylluan/agents.toml — declarative agent profiles for this repo.
#
# This file is the machine-readable counterpart to AGENTS.md.
# It assigns agent_ids to existing roles defined in tylluan.toml's
# [security.acl.roles] table — it does NOT define new roles.
#
# If a referenced role doesn't exist in [security.acl.roles], the kernel
# logs a warning and falls back to [security.acl].default_role for that
# agent — this is only "fail safe" if default_role itself is restrictive.
# Verified 2026-07-28: a real deployment's tylluan.toml had default_role =
# "admin" with only the admin role defined — roles referenced here that
# don't exist would silently grant FULL admin access, the opposite of
# fail-safe. Before relying on this file, confirm reader/writer/admin (or
# whatever roles you reference) actually exist in your own tylluan.toml
# [security.acl.roles], and that default_role is NOT admin.

[agents.claude-code]
role = "admin"
description = "Tech lead — orchestration, planning, cross-cutting fixes, verification"

[agents.deep]
role = "writer"
description = "Backend Rust + guilds Python — complex features, deep bug fixing"

# Deep's own [wake] (2026-09-21) — configured by Deep itself from a live
# session, per Jose: each agent sets up its own wake from its own side.
# Real invocation verified live: `opencode run "<prompt>"` runs headless on
# this machine with cached auth (exit 0, no unique setup needed — contract
# bwc-6fce78ed). The FIXED GENERIC PROMPT is the third argv element.
#
# auto_approve = true (Jose, same day, second decision after seeing the
# kernel's own poll loop confirmed as the persistent supervised connector
# real multi-agent bridges use: "relajamos la seguridad al minimo, si no
# podemos usarlo para que lo queremos"). No human click required anymore —
# what stays as the real safety net: (1) this allowlist (only claude-code
# and jose may trigger), (2) the command staying fixed/generic, never built
# from the mention's content, (3) a per-agent execution rate limit in
# dispatch_executor.rs (10/min) that replaces the human click as the
# anti-runaway-loop brake.
[agents.deep.wake]
enabled = true
trusted_authors = ["claude-code", "jose"]
auto_approve = true
command = ["opencode", "run", "Eres Deep, agente backend Rust + guilds Python de la flota Tylluan. Un compañero te ha mencionado en Coloquio. El mensaje siguiente contiene la mención: léela, revisa el contexto del canal si hace falta, y actúa según la cadena de trabajo establecida — responde en el canal o ejecuta la tarea y reporta. Nunca modifiques trabajo de otros agentes."]

[agents.mimo]
role = "writer"
description = "Dashboard audits/refactor — bounded, verified tasks, not open-ended design"

[agents.antigravity]
role = "writer"
description = "Dashboard/UI — browser-based, MCP client, bounded tasks only"

[agents.qwen]
role = "reader"
description = "Web research + deep research — SSE MCP, no disk access"

[agents.buffy]
role = "writer"
description = "Repo hygiene/refactor + independent verification — bounded, cross-checked tasks (added 2026-09-17, was missing: caused the @mention bridge to silently skip her real mentions)"

# First real [wake] test (2026-09-19, José's explicit choice) — proved the
# BWC-1..4 dispatcher loop end-to-end for the first time in production.
# Deliberately trivial and harmless: appends one timestamped line to a log
# file, nothing that touches real code, memory, or config.
# auto_approve = true (2026-09-21, same relaxation applied to Deep's entry)
# — allowlist + fixed command + rate limit remain the real safety net.
[agents.buffy.wake]
enabled = true
trusted_authors = ["jose"]
auto_approve = true
command = ["cmd", "/C", "echo WOKEN: buffy dispatch test >> data\\wake_test.log"]
