low_memory_mode = false

[nexus]
host = "127.0.0.1"
port = 4000
transport = [
    "http",
    "sse",
]
dev_mode = true
expose_guild_tools = true

[nexus.timeouts]
handshake_secs = 120
tool_call_secs = 3600

[memory]
db_path = "./data/tylluan.db"
# embedding_model: "bge-m3" (full, 2.2GB, best quality) | "none" (BM25 only, zero download)
embedding_model = "bge-m3"
vector_dimensions = 1024

[mesh.gossip]
# Tune these for your network. Doctor on satellite: fanout=1, timeout_secs=60.
# Server cluster: fanout=8, timeout_secs=5.
enabled = true
interval_secs = 30
fanout = 3
max_entries = 1000
max_peer_cursors = 100
timeout_secs = 5

[vision]
model_path = "HuggingFaceTB/SmolVLM2-256M-Instruct"

[tui]
enabled = true
refresh_ms = 1000

[guilds]
guild_max_concurrent_calls = 3

[guilds.core]
always_on = [
    "bash",
    "filesystem",
    "monitor",
    "system_metrics",
    "vision",
    "knowledge",
    "comfy_ui",
    "coloquio",
    "websearch",
    "deep_web_research",
    "code_graph",
    "scrapling",
    "scheduler",
]
lazy_load_timeout_secs = 300

[services]

[[external_mcp]]
name = "GitKraken"
command = "gk"
args = [
    "mcp",
    "--host=tylluan",
    "--source=gitlens",
    "--scheme=tylluan",
]
active = false

[[external_mcp]]
name = "tylluan-nexus"
command = "node"
args = ["e:/TylluanMCP/dist/index.js"]
active = false

[external_mcp.env]
MCP_TRANSPORT_STDIO = "true"
LOG_LEVEL = "info"
TYLLUAN_ROOT = "e:/TylluanMCP"

[[external_mcp]]
name = "gmp-code-assist"
command = "npx"
args = [
    "-y",
    "@googlemaps/code-assist-mcp@latest",
]
active = true

[external_mcp.env]
SOURCE = "tylluan"

[[external_mcp]]
name = "kokoro-tts"
command = "uv"
args = [
    "--directory",
    "E:/kokoro-tts-mcp",
    "run",
    "mcp-tts.py",
]
active = true

[external_mcp.env]
S3_ENABLED = "false"
TTS_SPEED = "1.0"
MP3_FOLDER = "E:/kokoro-tts-mcp/mp3"
TTS_VOICE = "af_heart"
UV_LINK_MODE = "copy"
TTS_LANGUAGE = "en-us"

[[external_mcp]]
name = "playwright"
command = "npx"
args = [
    "-y",
    "@playwright/mcp@latest",
    "--browser", "firefox",
    ]
active = true

[[external_mcp]]
name = "codebase_memory"
command = "npx"
args = [
    "-y",
    "codebase-memory-mcp",
]
active = true

[[federation_peers]]
name = "docker-secondary"
url = "http://127.0.0.1:3040"
token = "/+oI0H96a/GTFy/Vc9lZ7/toftCqSGsu"
last_sync = 1782055082
approved = true

[proxy.wsl]
enabled = true
auto_detect = true
fallback_port = 4001

[inference]
providers = []
primary_model = "local-v3"
device = "directml"

[silva]
db_path = "./data/silva.db"
decay_enabled = false
decay_interval_hours = 6
decay_prune_threshold = 0.15
sync_interval_ms = 5000

[limits]
max_requests_per_agent_per_min = 60

[tunnel]
enabled = true
wsl_bridge = true
wsl_bridge_port = 4002
wsl_bridge_cleanup = true

[timeouts]
system_guild_ms = 15000
analysis_guild_ms = 60000
heavy_guild_ms = 180000
mcp_client_heartbeat_ms = 8000

[sharing]
enabled = true
node_types = []
min_weight = 0.5
min_activity_hours = 24

[mdns]
advertise = false
discover = false

[nat]
# STUN servers for NAT traversal (ordered, first success wins)
stun_servers = ["stun.l.google.com:19302", "stun.cloudflare.com:3478"]
# Timeout per STUN attempt in seconds
stun_timeout_secs = 5
# Retries per server before trying the next
stun_retries = 2

# Security: Sandbox & Access Control
[security]
intent_filter = true

[security.sandbox]
enabled = false
image = "python:3.12-slim"
memory = "512m"
network = false
timeout_secs = 30

[security.acl]
default_role = "admin"

[security.acl.roles]
reader = ["knowledge", "coloquio", "monitor", "websearch"]
writer = ["knowledge", "coloquio", "monitor", "websearch", "filesystem", "git", "code_analysis"]
admin = ["*"]

[security.acl.tokens]
"test-reader-token" = "reader"
"test-writer-token" = "writer"
"test-admin-token" = "admin"

