name: Install Smoke Test

# Manual only. `release: types: [published]` never fired here in ~4 releases
# (v0.14-v0.17): GitHub does not deliver that event for releases created by
# the default GITHUB_TOKEN (anti-loop behavior, confirmed 2026-08-29). The
# real per-release boot-smoke now lives as a job inside release.yml, which
# can't have that failure mode (same-workflow `needs:`, not a cross-workflow
# event). This workflow still tests something that one doesn't: the actual
# install.sh/install.ps1 user-facing script against whatever is currently
# the latest published release. Run it by hand after a release if you want
# that specific path re-checked.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-smoke-linux:
    name: Install — Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Install Tylluan via install.sh
        run: curl -fsSL https://raw.githubusercontent.com/Forja-orca/tylluan/main/install.sh | bash

      - name: Verify health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/health >/dev/null 2>&1; then
              echo "::notice::Tylluan kernel is UP"
              curl -s http://127.0.0.1:4000/health
              exit 0
            fi
            sleep 1
          done
          echo "::error::Kernel did not start within 30 seconds"
          exit 1

  install-smoke-windows:
    name: Install — Windows (x86_64)
    runs-on: windows-2022
    steps:
      - name: Install Tylluan via install.ps1
        shell: pwsh
        run: |
          iex (Invoke-RestMethod https://raw.githubusercontent.com/Forja-orca/tylluan/main/install.ps1)

      - name: Verify health endpoint
        shell: pwsh
        run: |
          $Ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:4000/health" -UseBasicParsing -ErrorAction Stop
              if ($r.StatusCode -eq 200) {
                Write-Host "::notice::Tylluan kernel is UP"
                Write-Host $r.Content
                $Ready = $true
                break
              }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $Ready) {
            Write-Host "::error::Kernel did not start within 30 seconds"
            exit 1
          }
