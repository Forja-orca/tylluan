name: Install Smoke Test

# Manual + push-gated. Two trigger reasons:
#
# 1. `release: types: [published]` never fired here in ~4 releases (v0.14-v0.17):
#    GitHub does not deliver that event for releases created by the default
#    GITHUB_TOKEN (anti-loop behavior, confirmed 2026-08-29). The real
#    per-release boot-smoke now lives as a job inside release.yml, which can't
#    have that failure mode (same-workflow `needs:`, not a cross-workflow
#    event).
# 2. Manual-only was a real audit gap (buffy, T1064 finding #4 → confirmed
#    in TL T1071): the installers test the user-facing install.sh/install.ps1
#    against the latest RELEASED binary — exactly the path that breaks
#    silently when someone edits the installers or the CLI's `install
#    --profile` contract. That change path is now push-gated: a push to main that
#    touches the installers, the CLI, or the release workflow runs the smoke
#    against the current latest release. The path filter keeps the cost
#    bounded: edits to kernel internals, dashboard, docs, etc. don't re-run
#    it (they're covered by ci.yml / docker-smoke, which test artifacts,
#    not installers). Windows installer behavior can't be validated from
#    the Linux-only jobs already in ci.yml — this is the only guard for it.
#
# NOTE ON THE PATH TRIGGER: this tests HEAD installers against the LATEST
# PUBLISHED RELEASE binary. A fresh release first-contains-its-own-installer
# is covered by release.yml's boot-smoke job instead. The two checks test
# different failure surfaces (installed scripts vs released artifacts).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'crates/tylluan-cli/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/install-smoke.yml'

permissions:
  contents: read

jobs:
  install-smoke-linux:
    name: Install — Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Install Tylluan via install.sh
        run: curl -fsSL https://raw.githubusercontent.com/Forja-orca/tylluan/main/install.sh | bash

      - name: Verify health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:47004/health >/dev/null 2>&1; then
              echo "::notice::Tylluan kernel is UP"
              curl -s http://127.0.0.1:47004/health
              exit 0
            fi
            sleep 1
          done
          echo "::error::Kernel did not start within 30 seconds"
          exit 1

  install-smoke-windows:
    name: Install — Windows (x86_64)
    runs-on: windows-2022
    steps:
      - name: Install Tylluan via install.ps1
        shell: pwsh
        run: |
          iex (Invoke-RestMethod https://raw.githubusercontent.com/Forja-orca/tylluan/main/install.ps1)

      - name: Verify health endpoint
        shell: pwsh
        run: |
          $Ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:47004/health" -UseBasicParsing -ErrorAction Stop
              if ($r.StatusCode -eq 200) {
                Write-Host "::notice::Tylluan kernel is UP"
                Write-Host $r.Content
                $Ready = $true
                break
              }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $Ready) {
            Write-Host "::error::Kernel did not start within 30 seconds"
            exit 1
          }
