name: Docker Smoke
on:
  push:
    branches: [main]
    # `scripts/**` esta aqui por D205 (H-2 de Hermes): el Dockerfile copia
    # scripts/install_onnxruntime.sh, asi que un cambio solo en ese script no
    # disparaba este job y la imagen se quedaba sin validar.
    paths: ["Dockerfile", "tylluan.docker.toml", "crates/**", "Cargo.*", "dashboard/**", "scripts/**"]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        run: docker build -t tylluan:test .

      - name: Prepare data volume
        run: |
          mkdir -p ${{ github.workspace }}/.tylluan-data
          sudo chown 1000:1000 ${{ github.workspace }}/.tylluan-data

      - name: Start container
        run: |
          docker run -d --name tylluan-test \
            -p 3030:3030 \
            -v ${{ github.workspace }}/.tylluan-data:/data \
            tylluan:test

      - name: Verify container is running
        run: |
          if ! docker ps --filter name=tylluan-test --format "{{.Status}}" | grep -q "Up"; then
            echo "❌ Container is not running"
            docker logs tylluan-test 2>&1 | tail -40
            exit 1
          fi
          echo "✅ Container is up"

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3030/health > /dev/null 2>&1; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 2
          done
          echo "❌ Health check timed out (120s)"
          docker logs tylluan-test
          exit 1

      - name: Test setup-hint endpoint (authenticated)
        run: |
          TOKEN=$(docker exec tylluan-test cat /data/.tylluan-token)
          curl -sf -H "Authorization: Bearer $TOKEN" http://127.0.0.1:3030/api/v1/setup-hint \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ready'; assert d['embedding_model']=='none'; print('✅ setup-hint OK')"

      - name: Verify ONNX Runtime is the pinned build and the loader resolves it
        # D205 (H-1 de Hermes, 2026-11-18): el paso de arriba aserta
        # `embedding_model == "none"` (tylluan.docker.toml), asi que el kernel nunca
        # abre una sesion ONNX: un smoke verde NO probaba que la libreria instalada
        # sirviera, solo que el contenedor arranca. Esto si lo mira:
        #   - el fichero instalado es la version fijada (sello VERS_1.22.0), y
        #   - el loader la resuelve por soname, que es exactamente como la busca
        #     `ort` con load-dynamic al hacer dlopen.
        # NO prueba una inferencia real: para eso haria falta un modelo y embeddings
        # encendidos en esta imagen, que no es lo que se despliega.
        run: |
          docker exec tylluan-test sh -c '
            set -e
            test -f /usr/lib/libonnxruntime.so.1.22.0
            grep -aq VERS_1.22.0 /usr/lib/libonnxruntime.so.1.22.0
            ldconfig -p | grep -q "libonnxruntime.so.1 ("
            echo "✅ libonnxruntime.so.1.22.0 instalada y resuelta por el loader"
          '

      - name: Show container logs
        if: always()
        run: docker logs tylluan-test 2>&1 | tail -30

      - name: Cleanup
        if: always()
        run: docker rm -f tylluan-test
