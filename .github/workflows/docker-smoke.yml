name: Docker Smoke
on:
  push:
    branches: [main]
    paths: ["Dockerfile", "tylluan.docker.toml", "crates/**", "Cargo.*", "dashboard/**"]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t tylluan:test .

      - name: Start container
        run: |
          docker run -d --name tylluan-test \
            -p 3030:3030 \
            -v ${{ github.workspace }}/.tylluan-data:/data \
            tylluan:test

      - name: Verify container is running
        run: |
          if ! docker ps --filter name=tylluan-test --format "{{.Status}}" | grep -q "Up"; then
            echo "❌ Container is not running"
            docker logs tylluan-test 2>&1 | tail -40
            exit 1
          fi
          echo "✅ Container is up"

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3030/health > /dev/null 2>&1; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 2
          done
          echo "❌ Health check timed out (120s)"
          docker logs tylluan-test
          exit 1

      - name: Test setup-hint endpoint (authenticated)
        run: |
          TOKEN=$(docker exec tylluan-test cat /data/.tylluan-token)
          curl -sf -H "Authorization: Bearer $TOKEN" http://127.0.0.1:3030/api/v1/setup-hint \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ready'; assert d['embedding_model']=='none'; print('✅ setup-hint OK')"

      - name: Show container logs
        if: always()
        run: docker logs tylluan-test 2>&1 | tail -30

      - name: Cleanup
        if: always()
        run: docker rm -f tylluan-test
