name: Scheduled Heavy Tests

on:
  schedule:
    # Runs weekly on Monday at 03:17 UTC (minute != 0 and != 30 to prevent runner stampedes)
    - cron: '17 3 * * 1'
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.fastembed_cache
  HF_HOME: ${{ github.workspace }}/.cache/huggingface

permissions:
  contents: read

jobs:
  heavy-tests:
    name: Heavy Ignored Tests (Inference, Scale & PageRank)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.99.1

      - name: Install ONNX Runtime shared library
        run: |
          curl -fL --retry 6 --retry-delay 10 --retry-all-errors -o /tmp/onnxruntime.tgz "https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-linux-x64-1.22.0.tgz"
          gzip -t /tmp/onnxruntime.tgz
          tar -zxf /tmp/onnxruntime.tgz -C /tmp
          sudo mv /tmp/onnxruntime-linux-x64-1.22.0/lib/libonnxruntime.so* /usr/lib/
          rm -rf /tmp/onnxruntime*
          sudo ldconfig

      - name: Cache Embedding Models
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: |
            ${{ github.workspace }}/.fastembed_cache
            ${{ github.workspace }}/.cache/huggingface
          key: embedding-models-bge-m3-v1
          restore-keys: |
            embedding-models-

      - name: Run Ignored Heavy Tests
        id: run_tests
        run: |
          mkdir -p logs
          set -o pipefail
          cargo test -p tylluan-kernel --lib -- --ignored --nocapture 2>&1 | tee logs/ignored_tests.log

      - name: Generate Job Summary
        if: always()
        run: |
          echo "## Scheduled Heavy Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f logs/ignored_tests.log ]; then
            PASSED=$(grep -oE '[0-9]+ passed' logs/ignored_tests.log | tail -1 || echo "unknown")
            FAILED=$(grep -oE '[0-9]+ failed' logs/ignored_tests.log | tail -1 || echo "0 failed")
            IGNORED=$(grep -oE '[0-9]+ ignored' logs/ignored_tests.log | tail -1 || echo "0 ignored")
            echo "- **Result:** $PASSED; $FAILED; $IGNORED" >> $GITHUB_STEP_SUMMARY
            echo "- **Command:** \`cargo test -p tylluan-kernel --lib -- --ignored\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 30 logs/ignored_tests.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No test log found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: heavy-tests-logs
          path: logs/
          if-no-files-found: ignore

  integration-tests-ignored-weekly:
    name: Rust — #[ignore]d integration binaries (M9, weekly)
    # M9 (TL T2682, hermes design; relocated per TL T2754-1: ci.yml must NOT
    # carry a schedule trigger - on.schedule fires EVERY unguarded job in
    # that workflow. Home is scheduled-heavy-tests.yml (weekly Monday 03:17Z).
    # Every tests/ binary that contains a
    # #[ignore] runs once a week with -- --ignored, so manual debt stays
    # exercised instead of rotting silently. Stem list regenerates with:
    #   grep -l '#\[ignore' crates/tylluan-kernel/tests/*.rs \
    #     | xargs -n1 basename | sed 's/\.rs$//' | sort
    # (28 files measured on 3d3eb1b3; the TL's "21" counted a subset -- 28 is
    # the grep-literal set and the safer superset. ONE removed per
    # Deep's T2719 P3 + my backlog-#4 data: workspace_acceptance is the F9
    # harness frozen by Jose (weekly execution would revive it without an
    # order). a2a_live was also pulled pending its verdict; measured 2026-11-04
    # it runs in 4 s with ZERO spawn/bind/reqwest in its .rs -- in-process like
    # the rest -- so it stays IN. 27 stems wired here.)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true   # TL decision T2753(2): non-blocking until two consecutive green weekly runs, then flip to blocking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.99.1
      - name: Run ignored integration tests weekly
        run: |
          cargo test -p tylluan-kernel \
            --test a2a_live \
            --test adr024_containment_pending \
            --test approve_action_intent_adversarial \
            --test approve_action_self_approval \
            --test asi06_judge_hang_health \
            --test asi06_layer1_ingest_memory_write \
            --test asi06_layer1_ofuscacion_regresion \
            --test asi06_redteam_memory_poisoning \
            --test asi06_redteam_vias3_6 \
            --test bwc_agent_binding \
            --test bwc_close_binding \
            --test cola_d29_d30_acceptance \
            --test cola_d32_acceptance \
            --test continuity_probes \
            --test d32_vias_escritura_regresion \
            --test decide_adversarial \
            --test knowledge_guild_test \
            --test oauth_f2_adversarial_spec \
            --test oauth_f2_consent_adversarial \
            --test project_skills_store_mismatch \
            --test regression_d55_d56_outside_crate \
            --test regression_origin_host_outside_crate \
            --test remember_long_text_recall \
            --test repo_map_real_measure \
            --test sparse_cascade_bench \
            --test sparse_signature_spike \
            --test trust_banners_adversarial \
            -- --ignored

