name: Release

on:
  push:
    tags: ["v*"]
  # D210: ejecución en seco del pipeline SIN publicar nada. `publish` tiene
  # `if: github.event_name == 'push'`, así que un dispatch nunca promociona el
  # draft; sirve para ejercitar el gate de artefacto a mano.
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # D221 / decision de Jose (2026-11-07): Tylluan solo prueba y soporta
        # **Windows x86_64 y Linux x86_64** (WSL incluido). macOS/Apple Silicon y
        # Linux ARM64 (Raspberry Pi) dejan de prometerse: los binarios publicados
        # hasta 0.17.x siguen descargables, pero no se construyen ni se prueban.
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            suffix: ""
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            suffix: ".exe"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.99.1
          target: ${{ matrix.target }}

      # D5001 (P1 INS-LINUX-RELEASE-SIN-DASHBOARD): el binario embebe `dashboard/dist` con
      # rust-embed AL COMPILAR (`transport/http/mod.rs:85`), y la feature solo estaba activa en
      # la imagen Docker. Una release publicada sin esto se instala con el panel roto:
      # `GET /` -> «Dashboard not built. Run: cd dashboard && pnpm build», que pide Node y pnpm.
      # Los pasos son los mismos que ya usa el job `dashboard` de ci.yml.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "10"
      - name: Build shared package (@tylluan/ui-core)
        working-directory: packages/tylluan-ui-core
        run: npm ci --ignore-scripts && npm run build
      - name: Build dashboard (goes embedded into the kernel)
        working-directory: dashboard
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm run build

      - name: Build tylluan-nexus (release)
        run: cargo build --release -p tylluan-kernel --target ${{ matrix.target }} --features bundled-dashboard

      - name: Build tylluan-cli (release)
        run: cargo build --release -p tylluan-cli --target ${{ matrix.target }}

      - name: Prepare artifacts
        shell: bash
        run: |
          SUFFIX="${{ matrix.suffix }}"
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tylluan-nexus$SUFFIX dist/
          cp target/${{ matrix.target }}/release/tylluan-cli$SUFFIX dist/
          cp README.md dist/
          cp LICENSE dist/
          # Ship the Python guilds inside every release tarball (audit
          # finding B, 2026-10-09): without guilds/ on disk, a release-only
          # install has nothing for the `pip install -r guilds/requirements.txt`
          # command the installers print, and every Python guild spawn fails
          # (kernel spawn cwd + PYTHONPATH assume guilds/ exists next to the
          # kernel's working directory — guild_process.rs:362-374; the same
          # guilds/ dir bootstraps the router catalog, catalog.rs:579-600).
          # Measured payload: 185 KB compressed / 821 KB plain (73 .py files).
          cp -r guilds dist/guilds
          # D5001/D5002: ademas de ir embebido, se publica `dashboard/dist` en el tarball. El
          # kernel busca `./dashboard/dist` junto a tylluan.toml (`find_workspace_root`,
          # transport/http/mod.rs:1444/1573), asi que sirve de red si alguien compila sin la
          # feature o quiere cambiar el panel sin recompilar.
          # D5002 (TL, T5125): `mkdir -p` OBLIGATORIO. `cp -r a/b dist/dashboard/dist` con
          # `dist/dashboard` inexistente devuelve rc=1 «cannot create directory» y, con `bash -e`
          # (que es como corre el paso), tumbaba el job build de las dos plataformas. Reproducido:
          #   bash -e -c 'cp -r dashboard/dist dist/dashboard/dist'          -> rc=1
          #   bash -e -c 'mkdir -p dist/dashboard && cp -r dashboard/dist dist/dashboard/dist' -> rc=0
          mkdir -p dist/dashboard
          cp -r dashboard/dist dist/dashboard/dist
          # Bytecode caches: clean AFTER the copy so a stale or regenerated
          # `__pycache__`/`*.pyc` can never leak into the shipped artifact.
          find dist/guilds -name '__pycache__' -type d -prune -exec rm -rf {} +
          find dist/guilds -name '*.pyc' -delete

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tylluan-${{ matrix.target }}
          path: dist/

  package-draft:
    name: Package and Draft Release
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write       # firma sin clave (Sigstore) de la atestacion de procedencia
      attestations: write
    outputs:
      release_id: ${{ steps.create_draft.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4

      - name: Package and checksum
        shell: bash
        run: |
          set -e
          for dir in tylluan-*; do
            [ -d "$dir" ] || continue
            platform="${dir#tylluan-}"
            archive="tylluan-${platform}.tar.gz"
            cd "$dir"
            sha256sum tylluan-nexus* tylluan-cli* > checksums.txt
            # TL order 2026-11-10 (P1 installer): guilds/ travels inside the
            # tarball, so the tarball's OWN checksums.txt must cover it too.
            # install.sh runs `sha256sum -c` over every line and install.ps1
            # verifies every entry it accepts, so listing guilds here is what
            # turns "guilds/ happens to be in the archive" into "guilds/ is
            # verified before it is copied into the user's bin dir".
            # Sorted for byte-stable output; LC_ALL=C keeps the order stable.
            find guilds -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum >> checksums.txt
            # Coverage gate: no file may travel unverified. A silent `find`
            # failure (or a later edit that drops the line above) would leave
            # guilds/ uncovered while CI stayed green, so compare what got
            # checksummed against what is actually on disk. `cut -c67-` strips
            # the 66-char prefix of each line: "64 hex + two spaces" in text
            # mode, "64 hex + space + *" in binary mode (coreutils on Windows
            # emits the `*`), which is why the pattern accepts both.
            listed="$(grep -E '^[0-9a-f]{64} [ *]guilds/' checksums.txt | cut -c67- | LC_ALL=C sort || true)"
            ondisk="$(find guilds -type f | LC_ALL=C sort || true)"
            if [ -z "$listed" ] || [ "$listed" != "$ondisk" ]; then
              echo "::error::checksums.txt does not cover every guilds/ file"
              diff <(printf '%s\n' "$listed") <(printf '%s\n' "$ondisk") | head -20 || true
              exit 1
            fi
            echo "::notice::checksums.txt covers $(printf '%s\n' "$listed" | wc -l) guilds/ files + the binaries"
            # upload/download-artifact@v4 do not preserve the executable bit,
            # so the binaries would reach users as mode 0644 and a plain
            # `tar -xzf && ./tylluan-nexus` would fail with "Permission
            # denied". Restore it here, after the checksum, before tar.
            chmod +x tylluan-nexus* tylluan-cli*
            tar czf "../$archive" .
            cd ..
            # Anti-relapse gate (audit finding B): every release tarball MUST
            # contain guilds/ with the requirements file and core python guilds.
            # A regression here silently ships a CI-green release whose Python
            # guilds all fail at spawn "guilds/ not found" — invisible to the
            # boot smoke (it only checks /health). Fail the release job, not
            # the user. NOTE: members print with a `./` prefix because tar ran
            # over `.` — verified live against a real tar czf of dist/.
            # List once into a variable: `tar | grep -q` under `-o pipefail`
            # fails whenever grep exits early (tar gets SIGPIPE), which made
            # this gate report a present file as missing (v0.17.1 first run)
            # and would equally hide a real __pycache__ match below.
            listing="$(tar tzf "$archive")"
            if ! grep -Eq '^\./?guilds/requirements.txt$' <<<"$listing"; then
              echo "::error::$archive is missing guilds/requirements.txt (audit finding B regression)"
              exit 1
            fi
            if ! grep -Eq '^\./?guilds/core/(bash|coloquio|code_graph)\.py$' <<<"$listing"; then
              echo "::error::$archive is missing guilds/core python guilds (audit finding B regression)"
              exit 1
            fi
            # Executable bit gate: EVERY tylluan-nexus/tylluan-cli member must
            # be executable (and at least one must exist). Listed into a
            # variable, not piped to `grep -q`, for the same SIGPIPE reason.
            verbose="$(tar tvzf "$archive")"
            bins="$(grep -E ' \./?tylluan-(nexus|cli)(\.exe)?$' <<<"$verbose" || true)"
            nonexec="$(grep -Ev '^-r[w-]x' <<<"$bins" || true)"
            if [ -z "$bins" ] || [ -n "$nonexec" ]; then
              echo "::error::$archive binaries missing or lost their executable bit: ${nonexec:-none listed}"
              exit 1
            fi
            if grep -q '__pycache__' <<<"$listing"; then
              echo "::error::$archive contains __pycache__ (must not ship bytecode caches)"
              exit 1
            fi
            echo "::notice::$archive packaging OK: guilds/ requirements + core guilds present"
          done

      - name: Upload packaged archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-archives
          path: tylluan-*.tar.gz

      - name: Build release checksums manifest
        # AUD-01 (2026-10-28): `tylluan update` downloads this as its own release
        # asset; the checksums.txt inside each tarball is only for install.sh/.ps1.
        run: |
          sha256sum tylluan-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Attest build provenance
        # Decision de Jose (2026-10-29): sumas de verificacion + atestacion de procedencia
        # de GitHub, sin claves propias. Verificar: gh attestation verify <fichero> -R Forja-orca/tylluan
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            tylluan-*.tar.gz
            checksums.txt

      - name: Create Draft Release
        id: create_draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: |
            tylluan-*.tar.gz
            checksums.txt
          generate_release_notes: true

  version-gate:
    name: "Version gate (Tag vs Cargo vs /health)"
    needs: [package-draft]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-archives

      - name: Verify Cargo versions match tag
        shell: bash
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          echo "Verifying tag: $TAG (expected version: $TAG_VERSION)"

          # Both crates use `version.workspace = true`, so grepping their
          # Cargo.toml for `^version = ` matched nothing and `set -e` aborted
          # the gate (v0.17.1 second run). cargo metadata resolves inheritance.
          META="$(cargo metadata --no-deps --format-version 1)"
          pkg_version() {
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]==sys.argv[1]))' "$1" <<<"$META"
          }
          KERNEL_VER="$(pkg_version tylluan-kernel)"
          CLI_VER="$(pkg_version tylluan-cli)"

          if [ "$KERNEL_VER" != "$TAG_VERSION" ]; then
            echo "::error::tylluan-kernel Cargo.toml version ($KERNEL_VER) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          if [ "$CLI_VER" != "$TAG_VERSION" ]; then
            echo "::error::tylluan-cli Cargo.toml version ($CLI_VER) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "::notice::Cargo.toml versions match tag: $TAG_VERSION"

      - name: Verify binary /health in isolated environment
        shell: bash
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          TAG_VERSION="${TAG#v}"

          GATE_DIR="$RUNNER_TEMP/version-gate"
          DATA_DIR="$GATE_DIR/data"
          mkdir -p "$DATA_DIR"
          tar -xzf "$GITHUB_WORKSPACE/tylluan-x86_64-unknown-linux-gnu.tar.gz" -C "$GATE_DIR"

          chmod +x "$GATE_DIR/tylluan-nexus"

          # Isolated boot: dedicated data directory + dedicated non-default port 47008
          export TYLLUAN_DATA_DIR="$DATA_DIR"
          cd "$GATE_DIR"
          # Without a config the default transport includes stdio, and a
          # backgrounded step has a closed stdin: the kernel reads EOF and shuts
          # down ("Shutting down gracefully" 1ms after "operational", v0.17.1
          # third run). Same http-only config the CI boot smoke uses.
          cat > gate.toml <<EOF
          [nexus]
          host = "127.0.0.1"
          port = 47008
          transport = ["http"]
          dev_mode = true

          [memory]
          db_path = "$DATA_DIR/tylluan.db"
          embedding_model = "none"
          vector_dimensions = 0
          vector_limit = 100

          [silva]
          db_path = "$DATA_DIR/silva.db"
          EOF
          ./tylluan-nexus --config gate.toml > kernel.log 2>&1 &
          KERNEL_PID=$!

          READY=0
          HEALTH_RESP=""
          # /health answers {"status":"warming_up"} first and flips to "ok" a few
          # seconds later (measured: ~5s on the linux artifact); wait for "ok",
          # do not accept the first 200 (v0.17.1 dry-run in WSL).
          for i in $(seq 1 60); do
            HEALTH_RESP=$(curl -s http://127.0.0.1:47008/health 2>/dev/null || true)
            if echo "$HEALTH_RESP" | grep -q '"status":"ok"'; then
              echo "Kernel answered /health ok after ${i}s: $HEALTH_RESP"
              READY=1
              break
            fi
            sleep 1
          done

          kill "$KERNEL_PID" 2>/dev/null || true

          if [ "$READY" -ne 1 ]; then
            echo "::error::Kernel did not report health ok within 60s (last: $HEALTH_RESP)"
            cat kernel.log
            exit 1
          fi

          REPORTED_STATUS=$(echo "$HEALTH_RESP" | jq -r .status)
          REPORTED_VER=$(echo "$HEALTH_RESP" | jq -r .version)
          REPORTED_COMMIT=$(echo "$HEALTH_RESP" | jq -r .commit)

          if [ "$REPORTED_STATUS" != "ok" ]; then
            echo "::error::Health status is not 'ok': $REPORTED_STATUS"
            exit 1
          fi
          if [ "$REPORTED_VER" != "$TAG_VERSION" ]; then
            echo "::error::Health reported version ($REPORTED_VER) does not match tag version ($TAG_VERSION)"
            exit 1
          fi
          if [ -z "$REPORTED_COMMIT" ] || [ "$REPORTED_COMMIT" = "null" ]; then
            echo "::error::Health reported commit is empty or null"
            exit 1
          fi
          echo "::notice::Version gate PASSED: health ok, version $REPORTED_VER matches tag $TAG, commit $REPORTED_COMMIT"

  # Boot-smoke every platform's ACTUAL release artifact and verify install.sh/install.ps1.
  # Now runs against the draft artifacts before publishing to latest.
  smoke-test:
    name: "Boot & install smoke — ${{ matrix.target }}"
    needs: [package-draft, version-gate]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
        # D221 / decision de Jose (2026-11-07): fuera macOS/Apple Silicon y Linux
        # ARM64. Los dos targets que se construyen (Windows y Linux x86_64) se
        # boot-testean aqui; no queda ningun target construido sin smoke.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-archives

      - name: Test install.sh with draft release artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          ARCHIVE="$GITHUB_WORKSPACE/tylluan-${{ matrix.target }}.tar.gz"
          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Archive not found: $ARCHIVE"
            exit 1
          fi

          export TYLLUAN_DOWNLOAD_URL="$ARCHIVE"
          chmod +x ./install.sh
          ./install.sh

          READY=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:47004/health >/dev/null 2>&1; then
              echo "::notice::Tylluan (${{ matrix.target }}) installed and verified on :47004"
              curl -s http://127.0.0.1:47004/health
              READY=1
              break
            fi
            sleep 1
          done

          # Cleanly stop the background kernel
          pkill -x tylluan-nexus || true

          if [ "$READY" -ne 1 ]; then
            echo "::error::Kernel did not answer /health on :47004 within 30s"
            exit 1
          fi

      - name: Test install.ps1 with draft release artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Archive = "$env:GITHUB_WORKSPACE\tylluan-${{ matrix.target }}.tar.gz"
          if (-not (Test-Path $Archive)) {
            Write-Host "::error::Archive not found: $Archive"
            exit 1
          }

          $env:TYLLUAN_DOWNLOAD_URL = $Archive
          & .\install.ps1

          $Ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:47004/health" -UseBasicParsing -ErrorAction Stop
              if ($r.StatusCode -eq 200) {
                Write-Host "::notice::Tylluan (windows) installed and verified on :47004"
                Write-Host $r.Content
                $Ready = $true
                break
              }
            } catch {}
            Start-Sleep -Seconds 1
          }

          # Cleanly stop the background kernel
          Stop-Process -Name tylluan-nexus -Force -ErrorAction SilentlyContinue

          if (-not $Ready) {
            Write-Host "::error::Kernel did not answer /health on :47004 within 30s"
            exit 1
          }

          # Success must be explicit: install.ps1 probes for the Python guild deps,
          # a handled "missing" result leaves $LASTEXITCODE = 1, and the pwsh step
          # wrapper turns that stale code into a failure (v0.17.1 Windows smoke:
          # kernel verified healthy, step still failed).
          exit 0

  # Promote the draft release to public and latest ONLY when all smoke tests and gates pass.
  # Published by numeric release ID because GitHub CLI (`gh release edit <tag>`) cannot locate drafts by tag.
  # ── D210: gate de artefacto (auditoría externa, 3 puntos aceptados por José) ──
  # Corre DESPUÉS de empaquetar y ANTES de publicar: extrae el tarball en un HOME
  # temporal, exige `guilds/requirements-hashes.txt` en la raíz canónica, arranca un
  # guild REAL con el intérprete de esa instalación (handshake MCP, falla ante
  # ModuleNotFoundError) y comprueba que el `.tylluan-token` queda en 0600 (D206).
  # Si algo falla, el draft se queda como está: no se publica.
  artifact-gate:
    name: Release Artifact Gate (D210)
    needs: [package-draft, version-gate]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # TL (clase A): el proyecto exige Python >=3.12 (pyproject.toml) y los hashes se
      # compilaron con `--python-version 3.12`; el python3 de ubuntu-22.04 es el 3.10 y
      # el gate bloquearia TODA release. Mismo paso fijado que usa ci.yml.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-archives

      - name: Gate de los tres puntos de la auditoría externa
        shell: bash
        run: |
          set -euo pipefail
          TARBALL=tylluan-x86_64-unknown-linux-gnu.tar.gz
          [ -f "$TARBALL" ] || { echo "::error::no está $TARBALL"; ls -la; exit 1; }
          bash scripts/release_gate.sh --tarball "$TARBALL"

  # If any test fails, this job does not run, leaving the draft intact for log inspection.
  publish:
    name: Publish Release (Promote Draft to Latest)
    needs: [package-draft, version-gate, smoke-test, artifact-gate]
    # D210: un workflow_dispatch NO publica; solo un push de tag llega aquí.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote draft to latest release by release ID
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.package-draft.outputs.release_id }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Release ID from package-draft job is empty"
            exit 1
          fi
          echo "Promoting draft release ID $RELEASE_ID ($TAG) to published latest..."
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest="true"
          echo "::notice::Release $TAG (ID $RELEASE_ID) successfully published to latest!"
