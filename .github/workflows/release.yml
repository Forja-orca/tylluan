name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            suffix: ""
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            suffix: ""
            cross: true
          - target: aarch64-apple-darwin
            runner: macos-latest
            suffix: ""
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            suffix: ".exe"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Build tylluan-nexus (release)
        run: cargo build --release -p tylluan-kernel --target ${{ matrix.target }}

      - name: Build tylluan-cli (release)
        run: cargo build --release -p tylluan-cli --target ${{ matrix.target }}

      - name: Prepare artifacts
        shell: bash
        run: |
          SUFFIX="${{ matrix.suffix }}"
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tylluan-nexus$SUFFIX dist/
          cp target/${{ matrix.target }}/release/tylluan-cli$SUFFIX dist/
          cp README.md dist/
          cp LICENSE dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tylluan-${{ matrix.target }}
          path: dist/

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4

      - name: Package and checksum
        shell: bash
        run: |
          set -e
          for dir in tylluan-*; do
            [ -d "$dir" ] || continue
            platform="${dir#tylluan-}"
            archive="tylluan-${platform}.tar.gz"
            cd "$dir"
            sha256sum tylluan-nexus* tylluan-cli* > checksums.txt
            tar czf "../$archive" .
            cd ..
          done

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: tylluan-*.tar.gz
          generate_release_notes: true

  # Boot-smoke every platform's ACTUAL release artifact -- not "does it
  # compile" (the `build` job above already proved that), "does it start
  # and answer /health". Wired as a job in THIS workflow, not a separate
  # `release: published`-triggered one: GitHub does not fire that event for
  # releases created by the default GITHUB_TOKEN (intentional, anti-loop
  # behavior), which is why the old install-smoke.yml ran exactly once
  # (v0.13.0, manually) and silently never again for v0.14 through v0.17 --
  # found 2026-08-29 during the Tylluan portability design review. A `needs:`
  # dependency inside one workflow file can't have that failure mode.
  smoke-test:
    name: "Boot smoke — ${{ matrix.target }}"
    needs: [build]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
        # aarch64-unknown-linux-gnu (Raspberry Pi target) intentionally
        # excluded: no ARM64 GitHub-hosted runner exists to boot-test it
        # natively. `build`'s cross-compile check is all CI can verify for
        # that target; a real boot test needs actual ARM hardware.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tylluan-${{ matrix.target }}
          path: dist

      - name: Boot the real released binary and verify /health (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          chmod +x dist/tylluan-nexus
          mkdir -p /tmp/tylluan-smoke/data
          cd /tmp/tylluan-smoke
          cp "$GITHUB_WORKSPACE/dist/tylluan-nexus" .
          ./tylluan-nexus > kernel.log 2>&1 &
          KERNEL_PID=$!
          READY=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/health >/dev/null 2>&1; then
              echo "::notice::tylluan-nexus (${{ matrix.target }}) is UP"
              curl -s http://127.0.0.1:4000/health
              READY=1
              break
            fi
            sleep 1
          done
          kill "$KERNEL_PID" 2>/dev/null || true
          if [ "$READY" -ne 1 ]; then
            echo "::error::Kernel did not answer /health within 30s"
            cat kernel.log
            exit 1
          fi

      - name: Boot the real released binary and verify /health (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\tylluan-smoke"
          New-Item -ItemType Directory -Force -Path "$work\data" | Out-Null
          Copy-Item "dist\tylluan-nexus.exe" "$work\"
          Push-Location $work
          $proc = Start-Process -FilePath ".\tylluan-nexus.exe" -RedirectStandardOutput kernel.log -RedirectStandardError kernel.err.log -PassThru
          $Ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:4000/health" -UseBasicParsing -ErrorAction Stop
              if ($r.StatusCode -eq 200) {
                Write-Host "::notice::tylluan-nexus (windows) is UP"
                Write-Host $r.Content
                $Ready = $true
                break
              }
            } catch {}
            Start-Sleep -Seconds 1
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $Ready) {
            Write-Host "::error::Kernel did not answer /health within 30s"
            Get-Content kernel.log, kernel.err.log -ErrorAction SilentlyContinue
            exit 1
          }
          Pop-Location
