name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            suffix: ""
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            suffix: ""
            cross: true
          - target: aarch64-apple-darwin
            runner: macos-latest
            suffix: ""
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            suffix: ".exe"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Build tylluan-nexus (release)
        run: cargo build --release -p tylluan-kernel --target ${{ matrix.target }}

      - name: Build tylluan-cli (release)
        run: cargo build --release -p tylluan-cli --target ${{ matrix.target }}

      - name: Prepare artifacts
        shell: bash
        run: |
          SUFFIX="${{ matrix.suffix }}"
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tylluan-nexus$SUFFIX dist/
          cp target/${{ matrix.target }}/release/tylluan-cli$SUFFIX dist/
          cp README.md dist/
          cp LICENSE dist/
          # Ship the Python guilds inside every release tarball (audit
          # finding B, 2026-10-09): without guilds/ on disk, a release-only
          # install has nothing for the `pip install -r guilds/requirements.txt`
          # command the installers print, and every Python guild spawn fails
          # (kernel spawn cwd + PYTHONPATH assume guilds/ exists next to the
          # kernel's working directory — guild_process.rs:362-374; the same
          # guilds/ dir bootstraps the router catalog, catalog.rs:579-600).
          # Measured payload: 185 KB compressed / 821 KB plain (73 .py files).
          cp -r guilds dist/guilds
          # Bytecode caches: clean AFTER the copy so a stale or regenerated
          # `__pycache__`/`*.pyc` can never leak into the shipped artifact.
          find dist/guilds -name '__pycache__' -type d -prune -exec rm -rf {} +
          find dist/guilds -name '*.pyc' -delete

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tylluan-${{ matrix.target }}
          path: dist/

  package-draft:
    name: Package and Draft Release
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_draft.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4

      - name: Package and checksum
        shell: bash
        run: |
          set -e
          for dir in tylluan-*; do
            [ -d "$dir" ] || continue
            platform="${dir#tylluan-}"
            archive="tylluan-${platform}.tar.gz"
            cd "$dir"
            sha256sum tylluan-nexus* tylluan-cli* > checksums.txt
            tar czf "../$archive" .
            cd ..
            # Anti-relapse gate (audit finding B): every release tarball MUST
            # contain guilds/ with the requirements file and core python guilds.
            # A regression here silently ships a CI-green release whose Python
            # guilds all fail at spawn "guilds/ not found" — invisible to the
            # boot smoke (it only checks /health). Fail the release job, not
            # the user. NOTE: members print with a `./` prefix because tar ran
            # over `.` — verified live against a real tar czf of dist/.
            # List once into a variable: `tar | grep -q` under `-o pipefail`
            # fails whenever grep exits early (tar gets SIGPIPE), which made
            # this gate report a present file as missing (v0.17.1 first run)
            # and would equally hide a real __pycache__ match below.
            listing="$(tar tzf "$archive")"
            if ! grep -Eq '^\./?guilds/requirements.txt$' <<<"$listing"; then
              echo "::error::$archive is missing guilds/requirements.txt (audit finding B regression)"
              exit 1
            fi
            if ! grep -Eq '^\./?guilds/core/(bash|coloquio|code_graph)\.py$' <<<"$listing"; then
              echo "::error::$archive is missing guilds/core python guilds (audit finding B regression)"
              exit 1
            fi
            if grep -q '__pycache__' <<<"$listing"; then
              echo "::error::$archive contains __pycache__ (must not ship bytecode caches)"
              exit 1
            fi
            echo "::notice::$archive packaging OK: guilds/ requirements + core guilds present"
          done

      - name: Upload packaged archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-archives
          path: tylluan-*.tar.gz

      - name: Create Draft Release
        id: create_draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: tylluan-*.tar.gz
          generate_release_notes: true

  version-gate:
    name: "Version gate (Tag vs Cargo vs /health)"
    needs: [package-draft]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-archives

      - name: Verify Cargo versions match tag
        shell: bash
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          echo "Verifying tag: $TAG (expected version: $TAG_VERSION)"

          KERNEL_VER=$(grep -m1 '^version = ' crates/tylluan-kernel/Cargo.toml | cut -d'"' -f2)
          CLI_VER=$(grep -m1 '^version = ' crates/tylluan-cli/Cargo.toml | cut -d'"' -f2)

          if [ "$KERNEL_VER" != "$TAG_VERSION" ]; then
            echo "::error::tylluan-kernel Cargo.toml version ($KERNEL_VER) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          if [ "$CLI_VER" != "$TAG_VERSION" ]; then
            echo "::error::tylluan-cli Cargo.toml version ($CLI_VER) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "::notice::Cargo.toml versions match tag: $TAG_VERSION"

      - name: Verify binary /health in isolated environment
        shell: bash
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          TAG_VERSION="${TAG#v}"

          GATE_DIR="$RUNNER_TEMP/version-gate"
          DATA_DIR="$GATE_DIR/data"
          mkdir -p "$DATA_DIR"
          tar -xzf "$GITHUB_WORKSPACE/tylluan-x86_64-unknown-linux-gnu.tar.gz" -C "$GATE_DIR"

          chmod +x "$GATE_DIR/tylluan-nexus"

          # Isolated boot: dedicated data directory + dedicated non-default port 47008
          export TYLLUAN_DATA_DIR="$DATA_DIR"
          cd "$GATE_DIR"
          ./tylluan-nexus --port 47008 > kernel.log 2>&1 &
          KERNEL_PID=$!

          READY=0
          HEALTH_RESP=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:47008/health >/dev/null 2>&1; then
              HEALTH_RESP=$(curl -s http://127.0.0.1:47008/health)
              echo "Kernel answered /health: $HEALTH_RESP"
              READY=1
              break
            fi
            sleep 1
          done

          kill "$KERNEL_PID" 2>/dev/null || true

          if [ "$READY" -ne 1 ]; then
            echo "::error::Kernel did not answer /health within 30s"
            cat kernel.log
            exit 1
          fi

          REPORTED_STATUS=$(echo "$HEALTH_RESP" | jq -r .status)
          REPORTED_VER=$(echo "$HEALTH_RESP" | jq -r .version)
          REPORTED_COMMIT=$(echo "$HEALTH_RESP" | jq -r .commit)

          if [ "$REPORTED_STATUS" != "ok" ]; then
            echo "::error::Health status is not 'ok': $REPORTED_STATUS"
            exit 1
          fi
          if [ "$REPORTED_VER" != "$TAG_VERSION" ]; then
            echo "::error::Health reported version ($REPORTED_VER) does not match tag version ($TAG_VERSION)"
            exit 1
          fi
          if [ -z "$REPORTED_COMMIT" ] || [ "$REPORTED_COMMIT" = "null" ]; then
            echo "::error::Health reported commit is empty or null"
            exit 1
          fi
          echo "::notice::Version gate PASSED: health ok, version $REPORTED_VER matches tag $TAG, commit $REPORTED_COMMIT"

  # Boot-smoke every platform's ACTUAL release artifact and verify install.sh/install.ps1.
  # Now runs against the draft artifacts before publishing to latest.
  smoke-test:
    name: "Boot & install smoke — ${{ matrix.target }}"
    needs: [package-draft, version-gate]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
        # aarch64-unknown-linux-gnu (Raspberry Pi target) intentionally
        # excluded: no ARM64 GitHub-hosted runner exists to boot-test it
        # natively. `build`'s cross-compile check is all CI can verify for
        # that target; a real boot test needs actual ARM hardware.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-archives

      - name: Test install.sh with draft release artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          ARCHIVE="$GITHUB_WORKSPACE/tylluan-${{ matrix.target }}.tar.gz"
          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Archive not found: $ARCHIVE"
            exit 1
          fi

          export TYLLUAN_DOWNLOAD_URL="$ARCHIVE"
          chmod +x ./install.sh
          ./install.sh

          READY=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:47004/health >/dev/null 2>&1; then
              echo "::notice::Tylluan (${{ matrix.target }}) installed and verified on :47004"
              curl -s http://127.0.0.1:47004/health
              READY=1
              break
            fi
            sleep 1
          done

          # Cleanly stop the background kernel
          pkill -f tylluan || true

          if [ "$READY" -ne 1 ]; then
            echo "::error::Kernel did not answer /health on :47004 within 30s"
            exit 1
          fi

      - name: Test install.ps1 with draft release artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Archive = "$env:GITHUB_WORKSPACE\tylluan-${{ matrix.target }}.tar.gz"
          if (-not (Test-Path $Archive)) {
            Write-Host "::error::Archive not found: $Archive"
            exit 1
          }

          $env:TYLLUAN_DOWNLOAD_URL = $Archive
          & .\install.ps1

          $Ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:47004/health" -UseBasicParsing -ErrorAction Stop
              if ($r.StatusCode -eq 200) {
                Write-Host "::notice::Tylluan (windows) installed and verified on :47004"
                Write-Host $r.Content
                $Ready = $true
                break
              }
            } catch {}
            Start-Sleep -Seconds 1
          }

          # Cleanly stop the background kernel
          Stop-Process -Name tylluan-nexus -Force -ErrorAction SilentlyContinue

          if (-not $Ready) {
            Write-Host "::error::Kernel did not answer /health on :47004 within 30s"
            exit 1
          }

  # Promote the draft release to public and latest ONLY when all smoke tests and gates pass.
  # Published by numeric release ID because GitHub CLI (`gh release edit <tag>`) cannot locate drafts by tag.
  # If any test fails, this job does not run, leaving the draft intact for log inspection.
  publish:
    name: Publish Release (Promote Draft to Latest)
    needs: [package-draft, version-gate, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote draft to latest release by release ID
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.package-draft.outputs.release_id }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Release ID from package-draft job is empty"
            exit 1
          fi
          echo "Promoting draft release ID $RELEASE_ID ($TAG) to published latest..."
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest="true"
          echo "::notice::Release $TAG (ID $RELEASE_ID) successfully published to latest!"
