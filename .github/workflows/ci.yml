name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

permissions:
  contents: read

jobs:
  rust-build-test:
    name: Rust — build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - run: cargo check -p tylluan-kernel
      - run: cargo test -p tylluan-kernel --lib
      - run: cargo clippy -p tylluan-kernel --all-targets -- -D warnings

      - name: Check reproducible build (debug, fast)
        run: |
          cargo build -p tylluan-kernel 2>&1
          cp target/debug/tylluan-nexus target/debug/tylluan-nexus.v1
          cargo clean 2>&1
          cargo build -p tylluan-kernel 2>&1
          if cmp target/debug/tylluan-nexus target/debug/tylluan-nexus.v1; then
            echo "✅ Reproducible: debug builds produce identical binaries"
          else
            echo "⚠️ Non-reproducible: debug build differs between runs"
            echo "Common causes: embedded file paths, timestamps."
            echo "Set --remap-path-prefix in .cargo/config.toml for release builds."
          fi

  rust-security-audit:
    name: Rust — cargo-deny (licenses + advisories + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Bans + licenses + sources
        run: cargo deny check bans licenses sources
      - name: Advisory scan (informational — see deny.toml to ignore specific RUSec IDs)
        run: cargo deny check advisories

  security-claims-gate:
    name: "Security — claims gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install ripgrep
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ripgrep
      - name: Install ONNX Runtime shared library
        # Real bug found live in CI (2026-08-18): the kernel links `ort` with
        # the `load-dynamic` feature (see tylluan-kernel/Cargo.toml) -- it
        # never bundles ONNX Runtime, it loads libonnxruntime.so from the
        # system at runtime. This job builds and runs a real kernel binary
        # but never installed that library, so it panicked loading the Jina
        # Turbo reranker before ever binding its HTTP port -- both dynamic
        # claims failed with a misleading "port never logged" message that
        # was really "kernel crashed before it got that far". Same version
        # and install pattern as this repo's own Dockerfile (see Dockerfile
        # ~line 42-53) so CI matches the real, already-solved production case.
        run: |
          curl -L -o /tmp/onnxruntime.tgz "https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-linux-x64-1.22.0.tgz"
          tar -zxf /tmp/onnxruntime.tgz -C /tmp
          sudo mv /tmp/onnxruntime-linux-x64-1.22.0/lib/libonnxruntime.so* /usr/lib/
          rm -rf /tmp/onnxruntime*
          sudo ldconfig
      - name: Build release binary
        run: cargo build --release -p tylluan-kernel --bin tylluan-nexus
      - name: Build unapproved peer probe
        run: cargo build --release -p tylluan-link --bin unapproved_peer_probe
      - name: Run security claims gate
        run: python3 scripts/ci/claims/run_claims.py

  python-lint-test:
    name: Python — lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install ruff pytest pytest-asyncio -r guilds/requirements.txt
      - name: Ruff lint
        run: ruff check guilds/ tests/python/
      - name: Pytest
        run: pytest tests/python/ --ignore=tests/python/test_memory_bridge_e2e.py

  dashboard-lint:
    name: Dashboard — lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - name: Build shared package (@tylluan/ui-core)
        working-directory: packages/tylluan-ui-core
        run: npm install && npm run build
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Run dashboard hook tests
        run: pnpm test

  portability-check:
    name: Rust — ARM64 portability (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-unknown-linux-gnu

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Check tylluan-kernel (ARM64)
        run: cargo check -p tylluan-kernel --target aarch64-unknown-linux-gnu

      - name: Check tylluan-cli (ARM64)
        run: cargo check -p tylluan-cli --target aarch64-unknown-linux-gnu

  docs-test-count-check:
    name: Docs — README test count matches reality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Verify README.md's claimed test count against a live run
        run: bash scripts/check_test_count.sh

  docs-head-sync-check:
    name: Docs — STATUS.md HEAD citation matches reality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history needed: the script walks ancestry
                          # (git merge-base --is-ancestor, git rev-list
                          # --count) to tolerate citing the parent commit --
                          # a shallow clone (default depth=1) doesn't have
                          # that parent at all, so cat-file/merge-base fail
                          # on a perfectly valid citation. Caught live by
                          # this exact job on its first real CI run.
      - name: Verify STATUS.md cites exactly one HEAD and it's the real one
        run: bash scripts/check_head_sync.sh

  dead-config-report:
    name: Docs — dead config field report (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true # report-only by design -- see script header for
                             # why this heuristic can false-positive and must
                             # not block unrelated commits until triaged
    steps:
      - uses: actions/checkout@v4
      - name: Report config.rs fields that appear unread outside config.rs
        run: bash scripts/check_dead_config.sh

  boot-smoke-no-onnx:
    name: Boot smoke — no ONNX (BM25-only config must reach /health)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build release binary
        run: cargo build --release -p tylluan-kernel --bin tylluan-nexus
      - name: Generate minimal BM25-only config
        # Deliberately does NOT install libonnxruntime: this is the portable /
        # air-gapped path from README (--profile portable, embedding_model="none").
        # Before the T206 catch_unwind fix, `ort` (load-dynamic) PANICKED here
        # instead of returning Err, killing the kernel before it ever bound the
        # HTTP port -- exactly the bug class this smoke test exists to catch.
        # host=127.0.0.1 + dev_mode=true is safe (never 0.0.0.0 + dev_mode).
        run: |
          cat > /tmp/tylluan-smoke.toml <<'EOF'
          [nexus]
          host = "127.0.0.1"
          port = 4000
          transport = ["http"]
          dev_mode = true

          [memory]
          db_path = "/tmp/tylluan-smoke.db"
          embedding_model = "none"
          vector_dimensions = 0
          vector_limit = 100

          [silva]
          db_path = "/tmp/tylluan-smoke-silva.db"
          EOF
          echo "Config written:"
          cat /tmp/tylluan-smoke.toml
      - name: Boot kernel in background and wait for /health
        run: |
          ./target/release/tylluan-nexus --config /tmp/tylluan-smoke.toml > /tmp/tylluan-smoke.log 2>&1 &
          KERNEL_PID=$!
          echo "Kernel PID: $KERNEL_PID"
          echo "KERNEL_PID=$KERNEL_PID" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:4000/health > /tmp/tylluan-smoke-health.json 2>/dev/null; then
              echo "✅ Kernel healthy after ${i}s"
              cat /tmp/tylluan-smoke-health.json
              exit 0
            fi
            sleep 1
          done
          echo "❌ Kernel did not reach /health within 30s — process may have panicked (ort without ONNX) or hung."
          echo "--- last 50 log lines ---"
          tail -50 /tmp/tylluan-smoke.log || true
          echo "--- process still alive? ---"
          if kill -0 $KERNEL_PID 2>/dev/null; then echo "process ALIVE (hung, not crashed)"; else echo "process DEAD (crashed at boot)"; fi
          exit 1
      - name: Verify health JSON claims BM25-only mode
        if: always()
        run: |
          if [ -f /tmp/tylluan-smoke-health.json ]; then
            echo "Health payload:"
            cat /tmp/tylluan-smoke-health.json
          else
            echo "No health payload captured."
          fi
      - name: Cleanup kernel process
        if: always()
        run: |
          if [ -n "${KERNEL_PID:-}" ] && kill -0 $KERNEL_PID 2>/dev/null; then
            kill $KERNEL_PID 2>/dev/null || true
            echo "Kernel process $KERNEL_PID terminated."
          else
            echo "No live kernel process to clean up."
          fi

  e2e-security-tests:
    name: Rust — security audit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Generate DB Encryption Key for CI
        run: |
          # Generate a safe 64-character hex key (32 bytes) for SQLCipher tests
          echo "TYLLUAN_DB_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
      - name: Run security audit tests
        run: |
          cargo test -p tylluan-kernel --test security_audit
          cargo test -p tylluan-kernel --test guard_audit
          cargo test -p tylluan-kernel --test foundation_audit
          cargo test -p tylluan-kernel --test consensus_audit
          cargo test -p tylluan-kernel --test semantic_consensus_audit
          cargo test -p tylluan-kernel --test guild_integration_audit
          cargo test -p tylluan-kernel --test dashboard_api_audit
          cargo test -p tylluan-kernel --test federation_audit
          cargo test -p tylluan-kernel --test mesh_audit
