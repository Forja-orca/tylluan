# TylluanNexus o3 Sovereign Configuration Example
# Copy this to tylluan.toml and customize it.

[nexus]
host = "127.0.0.1"
port = 47004  # canonical default (CONTRACT-01) -- matches config.rs's default_port(), kept in sync 2026-10-09; README quick start uses the same 47004 (checked 2026-10-26)
# D-42: precedencia de arranque: --port/--host (CLI) > TYLLUAN_PORT/TYLLUAN_HOST
# (entorno) > este fichero. `--config` elige el fichero, pero ya no puede borrar
# los overrides de CLI/env (antes recargaba el TOML y perdía --port).
# D-38: si el puerto está ocupado, reintenta hasta N s y luego falla con error
# claro; nunca arranca en otro puerto en silencio. 0 = fallar de inmediato.
port_retry_secs = 10
transport = ["stdio", "http"]

# Security timeouts for tool execution and handshakes
[nexus.timeouts]
handshake_secs = 30
tool_call_secs = 120
lazy_load_timeout_secs = 180

[memory]
db_path = "data/tylluan.db"
# embedding_model options:
#   "mxbai-embed-large" — full quality, 1024-dim native (default since 2026-09-30)
#   "bge-m3"             — previous default, also 1024-dim native, still fully supported
#   "none"               — BM25 text search only, zero download, works on any hardware
# Tip: use "none" on first boot or low-RAM devices, upgrade later with tylluan-cli download-models
embedding_model = "mxbai-embed-large"
# CRITICAL: the embedding model MUST be 1024-dim native (mxbai-embed-large and
# bge-m3 both are). NEVER change to a 768-dim model without also migrating
# every existing vector -- this is a schema-breaking change, not a config flag.
vector_dimensions = 1024
# Max vector search results before partitioning
vector_limit = 5000

[mesh.gossip]
# Peer knowledge synchronisation over the mesh.
# Tune for your network profile:
#   Doctor on satellite link:   fanout=1, timeout_secs=60, interval_secs=300
#   LAN clinic (3-10 nodes):    fanout=3, timeout_secs=30, interval_secs=60  (defaults)
#   Server cluster (100+ nodes):fanout=8, timeout_secs=5,  interval_secs=10
enabled = true
interval_secs = 30
fanout = 3
max_entries = 1000
max_peer_cursors = 100
timeout_secs = 30

[guilds.core]
# Always spawned on startup — kept alive by watchdog
always_on = ["bash", "filesystem", "scheduler"]
# Pre-warmed at boot but CAN still be killed by idle timeout
warm_pool = ["git", "codebase_memory"]
# Seconds before an idle lazy guild is considered for suspension
idle_suspend_secs = 3600

# "V1 Port" guilds — real guild code that lives outside guilds/core, grouped by
# gremio directory. Each gremio's plugins are registered lazily (on first call)
# unless always_on = true. Keep this in sync with crates/tylluan-kernel/src/
# router/catalog.rs's test_lazy_or_always_on_guilds_are_registered, which
# parses this file (or the real tylluan.toml, when present) to verify every
# catalog guild has a real runtime registration path.
[guilds.v2]
legacy_fallback = "guilds/core"

[[guilds.v2.gremios]]
name = "wardens"
path = "guilds/wardens/plugins"
always_on = false
plugins = ["audit.py", "biome_warden.py"]
agents = []

[[guilds.v2.gremios]]
name = "builders"
path = "guilds/builders/plugins"
always_on = false
plugins = [
    "code.py",
    "audio_tools.py",
    "ffmpeg_tools.py",
    "screenshot_tools.py",
    "clipboard_tools.py",
    "local_llm_proxy.py",
]
agents = ["architect", "backend-dev", "frontend-dev"]

[[guilds.v2.gremios]]
name = "scholars"
path = "guilds/scholars/plugins"
always_on = false
plugins = ["memory.py", "search.py", "sequential_thinking.py", "ast_surgeon.py"]
agents = []

[[guilds.v2.gremios]]
name = "watchers"
path = "guilds/watchers/plugins"
always_on = false
plugins = ["cron_scheduler.py"]
agents = []

[performance]
# Reindexing interval (secs) - 600s recommended for low-RAM hardware
reindex_interval_secs = 600
# Node weight decay interval (secs)
decay_interval_secs = 300
# SQLite WAL checkpoint interval (secs)
checkpoint_interval_secs = 300

[observability]
# TC-03: objetivo SLO de disponibilidad (%) consumido por /api/v1/slo/summary,
# /api/v1/health/golden-signals y /api/v1/dashboard/summary. Banda "degraded"
# = target − 1.0 pp. Default 99.9 (comportamiento histórico).
slo_target = 99.9

[decision]
# ADR-021: servicio tylluan_decide (6ª herramienta soberana). Encendido por
# defecto; los contratos internos por defecto están en "shadow" y el resto en
# "off". Servicio apagado = status "disabled", sin ninguna llamada externa.
# Fase 2 (ADR-020, aprobada 2026-10-16): proveedor de modelo HTTP del
# dialecto System One, SOLO loopback (p. ej. `decima serve` :11436,
# `llama-server` :8080 u Ollama >= 0.35):
# [decision.provider]
# kind = "systemone_http"
# endpoint = "http://127.0.0.1:11436"
# model = "decima-small"
# request_timeout_ms = 5000    # carril síncrono (consultas libres)
# shadow_timeout_ms = 30000    # carril asíncrono (contratos en sombra)
# max_inflight = 1             # llama.cpp local suele ser single-slot

# Local LLM inference via llama.cpp
# T-DSH-116: REGISTRO DE PUNTOS DE INFERENCIA (por funcion). Cada punto elige
# proveedor: local_ephemeral | user_llama_server | openai_compatible |
# anthropic_compatible | ollama_compatible | systemone_http.
# La nube SOLO se usa si el punto activa cloud_enabled = true; la clave va por
# NOMBRE de variable de entorno (api_key_env), nunca en claro. Default: local
# efimero para los cuatro puntos.
# [inference.points.decision]
# provider = "local_ephemeral"
# endpoint = ""
# model = ""
# api_key_env = ""
# cloud_enabled = false
#
# [inference.points.grammar_judge]
# provider = "local_ephemeral"
# [inference.points.sentinel]
# provider = "local_ephemeral"
# [inference.points.chat]
# provider = "local_ephemeral"

[inference.llama]
# T-DSH-115: el llama-server es DEL USUARIO y esta APAGADO por defecto; no se
# autoarranca. Arrancalo explicitamente (tylluan sentinel? no: llama start /
# POST /api/v1/inference/llama/start / boton del dashboard).
# Modelo unico: ruta explicita a un .gguf (nunca se descarga nada).
# model_path = "E:\\modelos\\Qwen2.5-0.5B-Instruct-Q4_K_M.gguf"
# Modo router: carpeta de .gguf y maximo de modelos cargados (llama-server b10158).
# models_dir = "E:\\modelos"
# models_max = 4
# llama-server port (avoid Ollama 11434, LM Studio 1234, vLLM 8000, Gradio 7860)
port = 9000
n_gpu_layers = 0      # 0 = CPU only; set to 999 for all layers on GPU
ctx_size = 2048
n_keep = 0            # tokens del prompt inicial conservados al desplazar el contexto
                      # (0 = ninguno, default de llama.cpp; >0 cachea un prefijo fijo,
                      # p.ej. 64 con DPC/Deterministic Prefix Canonicalization para reusar
                      # el DPC_SYSTEM_ANCHOR invariante en llama-server)
threads = 0            # 0 = auto-detect CPU count
batch_size = 512
temperature = 0.7
top_p = 0.95
top_k = 64
repeat_penalty = 1.1

# Security: Sandbox, Access Control & Encryption
[security]
# Block dangerous intents (rm -rf, DROP TABLE, fork bombs, etc.) across the
# whole tylluan_do dispatch path. Defaults to true -- leave commented out
# to inherit that safe default, or set explicitly to false to opt out.
# intent_filter = true
# Encrypt SQLite databases at rest using SQLCipher (AES-256). Defaults to
# true only on binaries built with `--features encryption` (not in the
# default feature set -- bundles SQLCipher+OpenSSL, unsupported on Windows
# native). Leave commented out to inherit that default; only set this key
# explicitly if you need to override it, since setting `false` here
# disables encryption even on a binary that supports it.
# Requires TYLLUAN_DB_KEY environment variable (containing a 64-character hex key) or configured directly.
# WARNING: If you enable this on an existing database, you must migrate it first.
# encrypt_at_rest = true
# 64-character hex key (32 bytes) for SQLCipher hexkey. Only hex chars allowed for safety.
# encryption_key_hex = "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"

# CoherenceGate Layer 4 hybrid classification calling llama_backend. Defaults
# to FALSE. When true, EVERY tylluan_recall (any agent, any time of day) can
# silently auto-start a real llama-server subprocess in the background if its
# trigger zone activates -- not just at night. This contributed to a 4-day
# Unsloth training run being killed by GPU/CPU contention (2026-08-28). Only
# enable this if you understand that llama-server may start unattended while
# you are doing something else resource-intensive on this machine.
# coherence_gate_hybrid_enabled = false
# D-33: modelo que se envia al juez de la capa 2 (puerta de escritura ASI06) y
# a la capa 4. Necesario cuando el backend compatible con OpenAI tiene varios
# modelos cargados (LM Studio y similares): sin este campo el backend responde
# 400 y el juez queda inerte (se ve en /health?verbose=true ->
# components.judge.by_kind.backend_error). Vacio = el guild envia el primero que
# anuncie /v1/models. No cambia el modelo por defecto del backend.
# judge_model = "qwen2.5-0.5b-instruct"
# D-36: el juez no vuelve a llamar al modelo por el MISMO contenido (hash de
# prompt + gramatica) dentro de esta ventana; reutiliza el veredicto ya emitido.
# 0 desactiva el dedupe. Default 60 s. La cache solo guarda hash y veredicto,
# nunca el prompt ni el contenido. El semaforo de 1 ranura (llama-server arranca
# sin --parallel) sigue limitando cuantos juicios corren a la vez.
# judge_dedup_window_secs = 60
# Maximo de veredictos en memoria; se recortan primero los mas antiguos.
# judge_dedup_max_entries = 256

# Docker sandbox for bash/code guilds (opt-in, disabled by default)
# When enabled, bash and code guilds run in an isolated Docker container
# instead of directly on the host system.
[security.sandbox]
enabled = false
# Sandbox profile: strict | balanced | permissive
# strict: Docker for all guilds, process_execution=false, network=none
# balanced: Docker for bash/code only, enforcement per guild CAPABILITIES (default)
# permissive: no Docker, process_execution allowed, full network/filesystem
profile = "balanced"
image = "python:3.12-slim"
memory = "512m"
network = false
timeout_secs = 30

# Per-Guild ACL (fail-closed default)
# Restricts which guilds each token/role can access.
# An absent/empty roles map does NOT grant access: unlisted credentials fall
# back to `default_role = "guest"` (no guilds). The master token remains
# operator-class explicitly; add explicit roles/tokens for other agents.
[security.acl]
# D-68: fail-closed default. The master token is operator-class explicitly;
# every other unlisted credential falls back to guest, which has no guilds.
default_role = "guest"

# Define roles and their allowed guilds
[security.acl.roles]
guest = []
reader = ["knowledge", "coloquio", "monitor", "websearch"]
writer = ["knowledge", "coloquio", "monitor", "websearch", "filesystem", "git", "code_analysis"]
admin = ["*"]

# Map specific tokens to roles (use in place of or alongside default_role)
# [security.acl.tokens]
# "my-reader-token-here" = "reader"
# "my-writer-token-here" = "writer"

# M31-P0: deterministic pre/post hooks around the 6 sovereign tools (tylluan_do,
# tylluan_remember, tylluan_recall, tylluan_think, tylluan_graph, tylluan_decide) plus tylluan_ingest.
# Runs once for every MCP client (Claude Desktop, Claude Code, LM Studio, ...) --
# a single choke point to allow/deny/redact/inject context, not per-client logic.
# No LLM in this path by design: pure regex matching, deterministic and auditable.
# `tool` accepts a specific sovereign tool name or "*" for all of them.
# Changes here require a kernel restart to take effect (no hot-reload for hooks yet).
#
# Example: block anything that looks like a US SSN before it's ever written to memory.
# [[hooks]]
# tool = "tylluan_remember"
# phase = "pre"
# pattern = '\b\d{3}-\d{2}-\d{4}\b'
# action = "deny"
# message = "Blocked: content matches a PII pattern (SSN-shaped)."
#
# Example: redact API-key-shaped strings out of anything returned to the client.
# [[hooks]]
# tool = "*"
# phase = "post"
# pattern = 'sk-[A-Za-z0-9]{20,}'
# action = "redact"
# replacement = "[REDACTED_KEY]"
#
# Example: prepend a standing instruction to every tylluan_do call, for all clients.
# [[hooks]]
# tool = "tylluan_do"
# phase = "pre"
# action = "inject_context"
# inject = "Remember: always cite sources when recalling factual claims."

# External MCP Servers (Standard MCP protocol)
# [[external_mcp]]
# name = "postgresql"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-postgres", "postgresql://user:pass@localhost/db"]
# timeout_ms = 10000

# NightConsolidation (periodic background maintenance of the memory).
# [night]
# interval_secs = 1800        # rest between cycles, counted from the END of the previous cycle (60 s floor)
# max_parallel_phases = 2
# idle_lab_enabled = false    # IdleLab (retrieval hill-climbing) is OFF by default: measured at 0.0% gain
#                             # while using ~99.8% of the cycle on CPU (ADR-007, T-DSH-104). Turn on only to experiment.

# ── T-DSH-109: centinela local OPT-IN de write_gate L2 (juez Qwen3Guard) ──
# APAGADO por defecto. Con enabled=true el kernel arranca BAJO DEMANDA un
# llama-server propio con el GGUF de model_path (ruta explícita; NUNCA se
# descarga nada), en cola serie, con --threads acotado a 4, sin --mlock y
# prioridad BELOW_NORMAL best-effort; se descarga tras idle_unload_secs sin uso.
# Política: Unsafe -> cuarentena; Controversial -> marca para revisión;
# Safe -> pasa. Si el centinela falla o expira, NO bloquea (fail-open a L1/L2).
# Puerto 0 = efímero propio (nunca 47004). Un comentario por campo:
# [security.write_gate_judge]
# T-DSH-115: juez de gramatica de write_gate en servidor EFIMERO propio
# (patron del centinela: CPU, hilos<=4, prioridad baja, descarga por inactividad).
# NO usa el llama-server del usuario. Apagado por defecto (sin model_path).
# enabled = false
# model_path = "E:\\modelos\\Qwen2.5-0.5B-Instruct-Q4_K_M.gguf"
# llama_server_path = "C:\\ruta\\llama-server.exe"
# threads = 4
# ctx_size = 2048
# timeout_ms = 60000
# idle_unload_secs = 300
# max_cpu_pct = 85

[security.sentinel]
# T-DSH-113: off (default) | observe (puntua y registra, no marca) | enforce (aplica politica).
# enabled = true sin mode equivale a enforce (compatibilidad).
# mode = "off"
# enabled = false
# model_path = "E:\\tylluan-patches\\guard-eval\\models\\Qwen3Guard-Gen-0.6B.Q4_K_M.gguf"
# llama_server_path = "C:\\Users\\you\\.cache\\tylluan\\llama-cpp\\llama-server.exe"
# port = 0
# threads = 4
# ctx_size = 2048
# timeout_ms = 60000
# idle_unload_secs = 300
# T-DSH-114: si la CPU global supera este porcentaje, el centinela no lanza el
# llama-server (fail-open, cuenta cpu_skips en /health). Defecto 85.
# max_cpu_pct = 85
# El modo se cambia en caliente (sin reiniciar) por POST /api/v1/security/sentinel/mode
# o `tylluan sentinel mode <off|observe|enforce>`; ambos exigen clase operador.

[runtime]
# T-DSH-130 (ADR-025 R4): apagado ordenado con deadline de join.
# shutdown_timeout_ms = maximo de espera de las tareas de fondo registradas
# antes del corte duro. 0 = sin deadline (comportamiento historico).
shutdown_timeout_ms = 5000
# shutdown_force_exit = true corta el proceso con std::process::exit tras la
# secuencia ordenada si el runtime seguiria esperando hilos (ONNX/SQLite).
# Apagado por defecto: activarlo es decision del operador tras medir.
shutdown_force_exit = false
