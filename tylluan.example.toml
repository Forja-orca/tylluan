# TylluanNexus o3 Sovereign Configuration Example
# Copy this to tylluan.toml and customize it.

[nexus]
host = "127.0.0.1"
port = 3030
transport = ["stdio", "http"]

# Security timeouts for tool execution and handshakes
[nexus.timeouts]
handshake_secs = 30
tool_call_secs = 120
lazy_load_timeout_secs = 180

[memory]
db_path = "data/tylluan.db"
# embedding_model options:
#   "bge-m3"  — full quality, ~2.2 GB download, requires 4 GB+ RAM (default)
#   "none"    — BM25 text search only, zero download, works on any hardware
# Tip: use "none" on first boot or low-RAM devices, upgrade later with tylluan-cli download-models
embedding_model = "bge-m3"
# CRITICAL: BGE-M3 is native 1024-dim. NEVER change to 768.
vector_dimensions = 1024
# Max vector search results before partitioning
vector_limit = 5000

[mesh.gossip]
# Peer knowledge synchronisation over the mesh.
# Tune for your network profile:
#   Doctor on satellite link:   fanout=1, timeout_secs=60, interval_secs=300
#   LAN clinic (3-10 nodes):    fanout=3, timeout_secs=30, interval_secs=60  (defaults)
#   Server cluster (100+ nodes):fanout=8, timeout_secs=5,  interval_secs=10
enabled = true
interval_secs = 30
fanout = 3
max_entries = 1000
max_peer_cursors = 100
timeout_secs = 30

[guilds.core]
# Always spawned on startup — kept alive by watchdog
always_on = ["bash", "filesystem", "scheduler"]
# Pre-warmed at boot but CAN still be killed by idle timeout
warm_pool = ["git", "codebase_memory"]
# Seconds before an idle lazy guild is considered for suspension
idle_suspend_secs = 3600

[performance]
# Reindexing interval (secs) - 600s recommended for low-RAM hardware
reindex_interval_secs = 600
# Node weight decay interval (secs)
decay_interval_secs = 300
# SQLite WAL checkpoint interval (secs)
checkpoint_interval_secs = 300

# Security: Sandbox, Access Control & Encryption
[security]
# Block dangerous intents (rm -rf, DROP TABLE, fork bombs, etc.) across the
# whole tylluan_do dispatch path. Defaults to true -- leave commented out
# to inherit that safe default, or set explicitly to false to opt out.
# intent_filter = true
# Encrypt SQLite databases at rest using SQLCipher (AES-256). Defaults to
# true only on binaries built with `--features encryption` (not in the
# default feature set -- bundles SQLCipher+OpenSSL, unsupported on Windows
# native). Leave commented out to inherit that default; only set this key
# explicitly if you need to override it, since setting `false` here
# disables encryption even on a binary that supports it.
# Requires TYLLUAN_DB_KEY environment variable (containing a 64-character hex key) or configured directly.
# WARNING: If you enable this on an existing database, you must migrate it first.
# encrypt_at_rest = true
# 64-character hex key (32 bytes) for SQLCipher hexkey. Only hex chars allowed for safety.
# encryption_key_hex = "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"

# Docker sandbox for bash/code guilds (opt-in, disabled by default)
# When enabled, bash and code guilds run in an isolated Docker container
# instead of directly on the host system.
[security.sandbox]
enabled = false
# Sandbox profile: strict | balanced | permissive
# strict: Docker for all guilds, process_execution=false, network=none
# balanced: Docker for bash/code only, enforcement per guild CAPABILITIES (default)
# permissive: no Docker, process_execution allowed, full network/filesystem
profile = "balanced"
image = "python:3.12-slim"
memory = "512m"
network = false
timeout_secs = 30

# Per-Guild ACL (optional, opt-in)
# When configured, restricts which guilds each token/role can access.
# If this section is absent or empty, all guilds are accessible (backwards-compatible).
[security.acl]
# default_role applies to the bearer token when not listed in [security.acl.tokens]
default_role = "admin"

# Define roles and their allowed guilds
[security.acl.roles]
reader = ["knowledge", "coloquio", "monitor", "websearch"]
writer = ["knowledge", "coloquio", "monitor", "websearch", "filesystem", "git", "code_analysis"]
admin = ["*"]

# Map specific tokens to roles (use in place of or alongside default_role)
# [security.acl.tokens]
# "my-reader-token-here" = "reader"
# "my-writer-token-here" = "writer"

# M31-P0: deterministic pre/post hooks around the 5 sovereign tools (tylluan_do,
# tylluan_remember, tylluan_recall, tylluan_think, tylluan_graph) plus tylluan_ingest.
# Runs once for every MCP client (Claude Desktop, Claude Code, LM Studio, ...) --
# a single choke point to allow/deny/redact/inject context, not per-client logic.
# No LLM in this path by design: pure regex matching, deterministic and auditable.
# `tool` accepts a specific sovereign tool name or "*" for all of them.
# Changes here require a kernel restart to take effect (no hot-reload for hooks yet).
#
# Example: block anything that looks like a US SSN before it's ever written to memory.
# [[hooks]]
# tool = "tylluan_remember"
# phase = "pre"
# pattern = '\b\d{3}-\d{2}-\d{4}\b'
# action = "deny"
# message = "Blocked: content matches a PII pattern (SSN-shaped)."
#
# Example: redact API-key-shaped strings out of anything returned to the client.
# [[hooks]]
# tool = "*"
# phase = "post"
# pattern = 'sk-[A-Za-z0-9]{20,}'
# action = "redact"
# replacement = "[REDACTED_KEY]"
#
# Example: prepend a standing instruction to every tylluan_do call, for all clients.
# [[hooks]]
# tool = "tylluan_do"
# phase = "pre"
# action = "inject_context"
# inject = "Remember: always cite sources when recalling factual claims."

