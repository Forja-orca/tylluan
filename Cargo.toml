[workspace]
resolver = "2"
members = [
    "crates/tylluan-kernel",
    "crates/tylluan-common",
    "crates/tylluan-gui",
    "crates/tylluan-cli",
    "crates/tylluan-link",
    "crates/tylluan-evals",
    "crates/tylluan-fsrs",
]

[workspace.package]
version = "0.17.2"
edition = "2024"
authors = ["Tylluan Contributors"]
license = "MIT"
repository = "https://github.com/forja-orca/tylluan"
description = "Sovereign Agentic Hub — Rust microkernel + Python guilds over MCP"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
thiserror = "2"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"        # thin LTO: ~30% smaller binary vs debug, <60s extra vs fat LTO
codegen-units = 4   # parallel codegen — faster than 1, better than default 16 for size
strip = true        # strip debug symbols → ~12-15 MB final binary
panic = "abort"     # smaller binary, faster startup — no unwinding in production

# proptest 1.11.0's float sampler may overshoot a range bound on its first split
# and then clamps it ("not a problem for testing data", float_samplers.rs), but it
# first runs debug_assert!(self.low - result < self.intervals.step) (line 128).
# In dev builds that assert rarely fires and aborts the test from INSIDE the
# library: prop_cosine_self_is_one (0.01f32..1e3f32) failed the pre-push twice
# (2026-10-06, 2026-10-14) on a seed-dependent path no 200k-case run reproduced.
# Keep the clamp, drop the library's own debug assertions.
[profile.dev.package.proptest]
debug-assertions = false

[profile.release-debug]
inherits = "release"
strip = false       # keep symbols for profiling — `cargo build --profile release-debug`
debug = 1
