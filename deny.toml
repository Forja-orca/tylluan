[advisories]
unmaintained = "all"
yanked = "deny"
# ─── Deuda aceptada: regla de esta lista ────────────────────────────────────
#
# Cada ignore lleva **fecha de revisión** y **dueño**. Sin fecha, un ignore es
# una decisión que nadie revisitó nunca. Dueño por área (AGENTS.md: dependencias
# de crates/ → Deep). Revisión en cada cierre de release: si el aviso sigue
# vigente y el motivo escrito sigue siendo cierto, se actualiza la fecha; si ya
# no aplica, se borra la entrada. Si el motivo ya no es cierto y el aviso sigue,
# es un fallo, no deuda.
#
# Última revisión global: 2026-11-17 (Deep) — 10 avisos, motivos verificados uno a
# uno contra el código citado; ninguno se cae por sí solo.
ignore = [
    # fxhash — transitive via mdns-sd; no longer maintained but functional for our use
    # Revisión: 2026-11-16 · Dueño: Deep (triaje de dependencias)
    "RUSTSEC-2025-0057",
    # instant — transitive via mdns-sd; unmaintained, std::time::Instant replacement exists
    # Revisión: 2026-11-16 · Dueño: Deep (triaje de dependencias)
    "RUSTSEC-2024-0384",
    # number_prefix — transitive dep; unmaintained, low-risk display helper
    # Revisión: 2026-11-16 · Dueño: Deep (triaje de dependencias)
    "RUSTSEC-2025-0119",
    # paste — transitive via fastembed; unmaintained but ubiquitous pre-1.0 proc macro
    # Revisión: 2026-11-16 · Dueño: Deep (triaje de dependencias)
    "RUSTSEC-2024-0436",
    # RUSTSEC-2026-0189 — DNS rebinding in rmcp Streamable HTTP transport. Corrected 2026-08-12
    # (external audit): Tylluan's server DOES serve the Streamable HTTP dialect on /mcp
    # (mod.rs:1036-1038), the "SSE only" claim in the previous version of this comment was
    # wrong. Actual risk is low because rmcp is only used as a stdio client internally
    # (registry/proxy.rs:29-30), not as the vulnerable server-side rebinding surface -- but
    # the comment must not misdescribe the codebase. Revisit if rmcp's Streamable HTTP server
    # path is ever exercised directly.
    # Revisión: 2026-11-16 · Dueño: Deep (MCP/transporte). Reabrir si se ejerce /mcp como servidor.
    "RUSTSEC-2026-0189",
    # bincode 1.3.3 — used only for HNSW BLOB serialization in silva/hnsw.rs (2 call sites).
    # The advisory notes 1.3.3 is considered complete; no safe upgrade exists without a schema migration.
    # Revisión: 2026-11-16 · Dueño: Deep (silva/hnsw). Fecha de revisión comprometida: cierre de v0.18.0.
    #
    # Plan de migración a postcard (formato VERSIONADO del BLOB, sin big-bang):
    #   1. Cabecera: los BLOB nuevos empiezan con un MAGIC de 4 bytes (p. ej. `TYLP`) + 1 byte de
    #      versión (`0x02` = postcard). Un BLOB sin ese magic es un bincode antiguo (versión 0). NO
    #      basta un solo byte de versión: un bincode antiguo puede empezar por cualquier valor,
    #      también `0x02`, y se leería mal (revisión TL 2026-11-16).
    #   2. Lectura doble: `decode_blob()` acepta magic+postcard y bincode sin magic; la escritura
    #      es SIEMPRE magic+postcard desde el momento del cambio. Nada de reescribir en masa.
    #   3. Reescritura perezosa: cada `save_embedding`/`upsert` reescribe su fila a 0x02. Los
    #      BLOB viejos migran al tocarse; los que no se tocan siguen legibles (no caducan).
    #   4. Corte: cuando el recuento de BLOB sin magic (bincode antiguo) = 0 durante un release completo,
    #      se borra el camino bincode y se retira este ignore.
    #   5. Test de ida y vuelta por versión: escribir con bincode antiguo (fixture fijo en bytes) → leer con el
    #      decodificador nuevo → mismo vector; y al revés. Sin ese test no se toca el formato.
    "RUSTSEC-2025-0141",
    # RUSTSEC-2026-0002 — lru 0.12.5 IterMut unsound. Upgrade requires lru >=0.16.3. Not
    # triggered in our usage (embeddings.rs only calls get()/put(), never iterates).
    # Revisión: 2026-11-16 · Dueño: Deep (router/embeddings). Reabrir si aparece un iter() sobre la LRU.
    "RUSTSEC-2026-0002",
    # RUSTSEC-2026-0253 — lru 0.12.5 pop() use-after-free if a stored key's Drop impl panics
    # during unwinding. Our only usage (router/embeddings.rs) keys by String, which has no
    # custom Drop and cannot panic on drop -- unreachable in our code. Upgrading our own
    # direct dep to lru 0.18 (the fix) is not viable without splitting the dependency graph:
    # `mainline` (tylluan-link, optional `mainline-dht` feature) independently pins
    # `lru = "^0.12.2"` and has no newer release compatible with our other pins -- bumping
    # just our side reintroduces a duplicate-version `bans` failure instead of an advisory
    # one. Revisit if `mainline` ever relaxes its lru requirement.
    # Revisión: 2026-11-16 · Dueño: Deep (dependencias). Reabrir si `mainline` acepta lru >=0.16.3.
    "RUSTSEC-2026-0253",
    # chrono 0.4.45 — RUSTSEC-2026-0543: **unmaintained** (todas las versiones), NO es una
    # vulnerabilidad. No se puede quitar barato: entra de forma transitiva por `rmcp 0.1.5`
    # (dependencia ajena; tylluan-kernel la usa como cliente MCP) y además la usan
    # directamente tylluan-kernel y tylluan-cli en ~30 módulos (`cargo tree -i chrono`).
    # El aviso recomienda `jiff` o `time`: es una migración de fechas en todo el workspace.
    # Medido 2026-11-17 en el indice disperso de crates.io: de las **73** versiones
# publicadas de `rmcp`, **las 73** dependen de chrono (la ultima, 3.10.0, `^0.4.38` y NO
# opcional). No hay version de rmcp que permita salir del aviso por esa via.
    # Revisión: 2026-11-17 — Dueño: Deep (triaje de dependencias). Reabrir cuando `rmcp`
    # publique una versión sin chrono, o al planificar la migración a `jiff`/`time`.
    "RUSTSEC-2026-0543",
    # chrono-tz 0.10.4 — RUSTSEC-2026-0555: **unmaintained** (todas las versiones), NO es una
    # vulnerabilidad, y el aviso no recomienda sustituto. Es dependencia directa de
    # tylluan-kernel pero solo se usa en 3 sitios: las 6 zonas del reloj del mundo
    # (transport/http/api_v1/mcp.rs:501-507) y el parseo de un nombre de zona
    # (transport/server/handlers.rs:555/565). Sustituirla = meter otra base de datos de zonas
    # con DST (jiff, o `time` + tz): cambiar una dependencia por otra, no eliminarla.
    # Revisión: 2026-11-17 — Dueño: Deep (triaje de dependencias). Reabrir si se migra el
    # calendario a `jiff` (que trae zonas) o si el reloj de zonas se retira.
    "RUSTSEC-2026-0555",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "deny"
wildcards = "warn"
highlight = "all"
# Sovereignty invariant: pure rustls only, no OpenSSL in the dependency tree.
# A transitive dep silently pulling openssl-sys wouldn't fail CI before this --
# now it does, backing the "no OpenSSL" claim with an actual build-time check.
deny = [
    { name = "openssl-sys" },
    { name = "openssl" },
]
# Transitive duplicates from fastembed/rmcp/mdns-sd/rusqlite/rand ecosystem.
# These cannot be unified without upstream changes — pin only the oldest extras.
skip = [
    # base64: spm_precompiled→fastembed pulls 0.13, rmcp pulls 0.21; axum/reqwest own 0.22
    { name = "base64", version = "=0.13.1" },
    { name = "base64", version = "=0.21.7" },
    # foldhash: rusqlite→hashlink pulls 0.1.5; safetensors→fastembed owns 0.2
    { name = "foldhash", version = "=0.1.5" },
    # getrandom: rand 0.8 → 0.2; ring/webpki ecosystem → 0.3; latest is 0.4
    { name = "getrandom", version = "=0.2.17" },
    { name = "getrandom", version = "=0.3.4" },
    # hashbrown: four versions from rusqlite / fastembed / axum / tokio ecosystems
    { name = "hashbrown", version = "=0.14.5" },
    { name = "hashbrown", version = "=0.15.5" },
    { name = "hashbrown", version = "=0.16.1" },
    # nom: various parsers still on 7.x
    { name = "nom", version = "=7.1.3" },
    # rand ecosystem: rand 0.8 / rand_chacha 0.3 / rand_core 0.6 from older fastembed deps
    { name = "rand", version = "=0.8.6" },
    { name = "rand_chacha", version = "=0.3.1" },
    { name = "rand_core", version = "=0.6.4" },
    # smallvec: mdns-sd pulls 1.x; newer deps use 2.x alpha
    { name = "smallvec", version = "=1.15.2" },
    # socket2: tokio 1.x brought in 0.5; hyper/h2 now on 0.6
    { name = "socket2", version = "=0.5.10" },
    # webpki-roots: rustls 0.22 pulled 0.26; rustls 0.23 ships 1.x
    { name = "webpki-roots", version = "=0.26.11" },
    # windows-* family: multiple Windows SDK vintages from transitive deps
    { name = "windows-result", version = "=0.1.2" },
    { name = "windows-sys", version = "=0.52.0" },
    { name = "windows-sys", version = "=0.59.0" },
    { name = "windows-sys", version = "=0.60.2" },
    { name = "windows-targets", version = "=0.52.6" },
    { name = "windows_x86_64_msvc", version = "=0.52.6" },
    # New duplicates from sysinfo/scraper/rav1e/mdns-sd transitive chains
    { name = "bitflags", version = "=1.3.2" },
    { name = "r-efi", version = "=5.3.0" },
    { name = "sysinfo", version = "=0.32.1" },
    { name = "windows-core", version = "=0.57.0" },
    { name = "windows-implement", version = "=0.57.0" },
    { name = "windows-interface", version = "=0.57.0" },
    { name = "windows_aarch64_gnullvm", version = "=0.52.6" },
    { name = "windows_aarch64_msvc", version = "=0.52.6" },
    { name = "windows_i686_gnu", version = "=0.52.6" },
    { name = "windows_i686_gnullvm", version = "=0.52.6" },
    { name = "windows_i686_msvc", version = "=0.52.6" },
    { name = "windows_x86_64_gnu", version = "=0.52.6" },
    { name = "windows_x86_64_gnullvm", version = "=0.52.6" },
    # phf/phf_shared: scraper→cssparser/markup5ever pull 0.11.3; chrono-tz (added for
    # identity temporal grounding, 2026-07-20) owns 0.12.1. No shared upgrade path --
    # scraper's chain is pinned by html5ever/selectors, chrono-tz needs the newer phf.
    { name = "phf", version = "=0.11.3" },
    { name = "phf_shared", version = "=0.11.3" },
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-git = []
