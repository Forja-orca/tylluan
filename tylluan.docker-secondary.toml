# Tylluan — Docker runtime config, SECONDARY instance (federation testing)
# Mirrors tylluan.docker.toml but with its own federation peer pre-approved
# pointing back at the native primary instance (host.docker.internal:4000).
# host = "0.0.0.0" is intentional here (Docker port mapping).
# dev_mode = false so auth is enforced. Never combine 0.0.0.0 + dev_mode=true.

[nexus]
host = "0.0.0.0"
port = 3030
transport = ["http"]
dev_mode = false

[nexus.timeouts]
handshake_secs = 30
tool_call_secs = 3600
lazy_load_timeout_secs = 600

[memory]
db_path = "tylluan.db"
embedding_model = "none"
vector_dimensions = 0
vector_limit = 5000

[performance]
reindex_interval_secs = 600
decay_interval_secs = 300

[sharing]
enabled = true

[guilds.core]
always_on = []

[federation]
enabled = true

[[federation_peers]]
name     = "native-primary"
url      = "http://host.docker.internal:4000"
auth_token = "dev-mode-no-auth"
approved = true
