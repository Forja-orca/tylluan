<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">What happens when an agent remembers and recalls</title>
  <desc id="d">Remember: the text is stored in SQLite with a local embedding and graph links. Recall: keyword search, plus vector and graph search when an embedding model is on, run together, rankings are fused, a coherence gate filters suspicious memories, and results return to the agent.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h { font-size: 17px; font-weight: 700; }
    .b { font-size: 15px; }
    .s { font-size: 13.5px; fill: #57606a; }
    .lane { font-size: 15px; font-weight: 700; fill: #0f766e; }
  </style>
  <rect x="1" y="1" width="958" height="328" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <!-- write lane -->
  <text x="30" y="40" class="lane">SAVE</text>
  <rect x="30" y="54" width="250" height="76" rx="10" fill="#ffffff" stroke="#8c959f"/>
  <text x="46" y="82" class="h">tylluan_remember</text>
  <text x="46" y="106" class="s">the agent sends text to keep</text>
  <line x1="282" y1="92" x2="338" y2="92" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="340" y="54" width="580" height="76" rx="10" fill="#e6f4f1" stroke="#0f766e"/>
  <text x="356" y="82" class="h">Stored on your disk</text>
  <text x="356" y="104" class="s">SQLite row + local embedding + links in the knowledge graph.</text>
  <text x="356" y="122" class="s">Stays on this machine unless you enable sync.</text>

  <!-- read lane -->
  <text x="30" y="178" class="lane">RECALL</text>
  <rect x="30" y="192" width="150" height="100" rx="10" fill="#ffffff" stroke="#8c959f"/>
  <text x="46" y="220" class="h">tylluan_recall</text>
  <text x="46" y="244" class="s">the agent asks</text>
  <text x="46" y="262" class="s">a question</text>

  <line x1="182" y1="242" x2="224" y2="242" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="226" y="192" width="210" height="100" rx="10" fill="#e6f4f1" stroke="#0f766e"/>
  <text x="242" y="220" class="h">Search</text>
  <text x="242" y="244" class="s">keyword (BM25); vector,</text>
  <text x="242" y="262" class="s">graph if embeddings on</text>

  <line x1="438" y1="242" x2="480" y2="242" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="482" y="192" width="150" height="100" rx="10" fill="#e6f4f1" stroke="#0f766e"/>
  <text x="498" y="220" class="h">Fuse</text>
  <text x="498" y="244" class="s">merge the three</text>
  <text x="498" y="262" class="s">rankings (RRF)</text>

  <line x1="634" y1="242" x2="676" y2="242" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="678" y="192" width="242" height="100" rx="10" fill="#e6f4f1" stroke="#0f766e"/>
  <text x="694" y="220" class="h">Coherence gate</text>
  <text x="694" y="244" class="s">filters memories that look</text>
  <text x="694" y="262" class="s">poisoned, then returns results</text>
</svg>
