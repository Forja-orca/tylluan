# Security Claims Manifest
#
# Every entry here pairs a documented claim in SECURITY.md or
# SECURITY_FEDERATION.md with a real, automated check. Passing this file's
# checks means the SPECIFIC documented property still holds against the
# SPECIFIC check written here -- it is not a general security guarantee.
#
# See docs/superpowers/specs/2026-08-18-security-claims-ci-gate-design.md

[[claim]]
id = "p2p-dispatch-wires-peer-approval"
doc_source = "crates/tylluan-link/src/p2p.rs (peer_is_approved call site, ~line 197)"
statement = "The P2P dispatch listener's LAN-reachable bind (0.0.0.0, required for real cross-machine federation) is only ever safe because every request is checked against peer_is_approved() before any tool executes -- this claim checks that the wiring exists, not the bind address itself. RULING (2026-08-18, José): the original claim id 'no-lan-bind-p2p-listener' assumed binding 0.0.0.0 was itself the problem; it is not -- federation requires it. The 2026-08-12 RCE's real root cause was missing peer verification, already fixed and tested in p2p.rs (peer_is_approved, fail-closed on empty set). This claim targets that root cause instead of the address family. Scope corrected 2026-08-18: the check/call site lives in p2p.rs, not mod.rs (mod.rs only starts the listener) -- first draft of this claim scoped the wrong file and would have always failed."
check = "static"
pattern = 'peer_is_approved'
expect = "present"
scope = ["crates/tylluan-link/src/p2p.rs"]

[[claim]]
id = "host-devmode-force-corrects-with-warning"
doc_source = "docs/concepts/SECURITY.md:19"
statement = "If host=0.0.0.0 and dev_mode=true are both set, the kernel logs a CRITICAL_SECURITY_TRIGGER warning naming the unsafe host and force-corrects it to 127.0.0.1 before boot -- it does NOT refuse to start. RULING (2026-08-18, José): the original claim ('refuses to start') was found false against real code by this gate's own first dynamic-script construction -- validate_security() in config.rs auto-corrects instead of refusing. José chose to fix the doc to match the real (and already reasonably safe: warned, fail-safe-by-correction) behavior rather than change the code to hard-refuse."
check = "dynamic"
script = "scripts/ci/claims/host_devmode_force_corrects.sh"

[[claim]]
id = "encrypt-at-rest-single-choke-point"
doc_source = "docs/concepts/SECURITY.md:56"
statement = "Every real database goes through config::open_db() -- zero direct rusqlite::Connection::open calls elsewhere"
check = "static"
pattern = 'Connection::open\('
scope = ["crates/tylluan-kernel/src/"]
exclude_file = "crates/tylluan-kernel/src/config.rs"

[[claim]]
id = "p2p-rejects-unapproved-peer"
doc_source = "docs/concepts/SECURITY_FEDERATION.md:13"
statement = "Peers are not discovered automatically -- they must be explicitly approved before dispatch is accepted"
check = "dynamic"
script = "scripts/ci/claims/p2p_rejects_unapproved.sh"

[[claim]]
id = "write-gate-hard-rejects-known-patterns"
doc_source = "docs/concepts/SECURITY.md:114"
statement = "tylluan_remember hard-rejects known injection patterns -- the node is never created"
check = "dynamic"
script = "scripts/ci/claims/write_gate_rejects.sh"
